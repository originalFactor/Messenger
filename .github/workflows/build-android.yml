name: Build Android

on:
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build-android:
    # One job, one ABI: `splits.abi` (driven by the root build script's
    # ext["androidAbis"] = arm64-v8a) emits the arm64-v8a APK for both
    # :androidApp and its :runtime companion in a single Gradle invocation.
    name: Build androidApp + runtime release APKs (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version (semantic name from VERSION, code from commit count)
        shell: bash
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "Building Messenger $(tr -d '[:space:]' < VERSION) ($(git rev-list --count HEAD))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # :runtime builds the vendored PTY JNI (libtermux.so) with CMake; both
          # tools are pinned in the root build script's ext block and must match
          # exactly, because android.builder.sdkDownload=false forbids AGP from
          # fetching anything else.
          packages: 'ndk;30.0.16248370 cmake;4.1.2 build-tools;37.0.0 platforms;android-37.0'

      # :core-bindings compiles the Rust core (core/rust) via cargo-ndk for the
      # shipped ABI; cargo-ndk picks the NDK up from ANDROID_HOME. The target
      # list is derived from the same ext["androidAbis"] as the APK splits, so
      # keep these in sync if the matrix ever changes.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Decode keystore (push builds)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p keyring
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keyring/messenger-release.jks

      - name: Build androidApp and runtime release APKs
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          # Explicit, even though it is the default: the phone apps ship
          # arm64-v8a only, and this is the one place a reviewer should see it.
          ANDROID_ABIS: arm64-v8a
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: ./gradlew :androidApp:assembleRelease :runtime:assembleRelease

      - name: Upload androidApp release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-release
          path: androidApp/build/outputs/apk/release/androidApp-*-release*.apk
          if-no-files-found: error

      - name: Upload runtime release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-release
          path: runtime/build/outputs/apk/release/runtime-*-release*.apk
          if-no-files-found: error
