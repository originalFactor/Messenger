name: Build Desktop

on:
  workflow_call:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: desktop-windows-x86_64
            task: packageReleaseMsi
            upload: desktopApp/build/compose/binaries/main-release/msi/*.msi
            gradlew: .\gradlew.bat
          - os: ubuntu-24.04
            artifact: desktop-linux-x86_64
            task: packageReleaseDeb
            upload: desktopApp/build/compose/binaries/main-release/deb/*
            gradlew: ./gradlew
          # macos-15 is an Apple Silicon runner; the native Core and JRE are arm64.
          - os: macos-15
            artifact: desktop-macos-arm64
            task: packageReleaseDmg
            upload: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
            gradlew: ./gradlew

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Version codes depend on the complete commit count. The server
          # submodule is not an input to any native client.
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "Building Messenger $(tr -d '[:space:]' < VERSION)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Apple Silicon toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch = aarch64'

      # AGP configures Android modules even for JVM builds. No SDK/NDK
      # packages are needed when runtime's externalNativeBuild is disabled.
      - name: Provide an Android SDK location for AGP configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system webview build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/rust
            desktopApp/webview -> ../build/webview-target
          # Separate host architectures and refresh workspace artifacts when
          # source changes; dependency caches remain available as fallbacks.
          key: desktop-${{ runner.arch }}-${{ hashFiles('core/rust/crates/**', 'desktopApp/webview/Cargo.*', 'desktopApp/webview/src/**', 'VERSION') }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      # All client targets are JVM/Android; none use Kotlin/Native (~/.konan).
      - name: Point WIX_PATH at the preinstalled WiX toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.14\bin"
          )
          $wix = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($wix) {
            "WIX_PATH=$wix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "::warning::No preinstalled WiX found; Compose will download it."
          }

      # One release build per OS. Arch packaging below reuses the Deb payload,
      # including its bundled JRE, launchers and ProGuard-processed jars.
      - name: Build Desktop distribution
        run: ${{ matrix.gradlew }} :desktopApp:${{ matrix.task }} "-Pmessenger.buildRuntimeNative=false"

      - name: Package Arch Linux from the existing distribution
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          packages=(desktopApp/build/compose/binaries/main-release/deb/*.deb)
          test "${#packages[@]}" -eq 1
          bash .github/scripts/package-arch.sh "${packages[0]}"

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload }}
          if-no-files-found: error
          # Installers are already compressed; avoid recompressing them.
          compression-level: 0
