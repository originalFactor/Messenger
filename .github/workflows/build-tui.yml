name: Build TUI

on:
  workflow_call:

jobs:
  build-tui:
    name: Build TUI binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      # The four binaries are independent release assets: one failing target
      # must not cancel the others, so every result is visible in a single run.
      fail-fast: false
      matrix:
        include:
          # Each target is its runner's host triple, so this is a plain host
          # `cargo build` — no cross toolchain, no `--target`, no linker setup.
          # That is why the arm64 entries run on arm64 runners rather than
          # cross-compiling from x64.
#          - os: ubuntu-latest
#            target: x86_64-unknown-linux-gnu
#            exe: messenger-tui
#          - os: ubuntu-24.04-arm
#            target: aarch64-unknown-linux-gnu
#            exe: messenger-tui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: messenger-tui.exe
#          - os: windows-11-arm
#            target: aarch64-pc-windows-msvc
#            exe: messenger-tui.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # messenger-core's build.rs bakes the git commit count into the
          # binary's version, so the full history is part of the build input.
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version (semantic name from VERSION, code from commit count)
        shell: bash
        run: |
          commitCount=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$commitCount" >> "$GITHUB_ENV"
          echo "Building Messenger $(tr -d '[:space:]' < VERSION) ($commitCount)"

      # The host triple must be the runner's own: rustup's default toolchain on
      # windows-11-arm / ubuntu-24.04-arm is already the aarch64 one.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      # Linux only: the TUI's clipboard/image support (arboard) builds against
      # X11 and Wayland client libraries, which the Ubuntu images do not ship
      # by default. Installed on both Linux runners so x86_64 and arm64 are
      # built identically.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libxkbcommon-dev

      # Deliberately cargo, not Gradle: the TUI links the Rust crates directly
      # (no UniFFI, no Kotlin), and Gradle stays out of this path. This job only
      # has to prove the binary BUILDS — Rust tests remain the local
      # `cargo test --workspace` in core/rust.
      - name: Build messenger-tui
        working-directory: core/rust
        run: cargo build --release --locked -p messenger-tui

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: core/rust/target/release/${{ matrix.exe }}
          if-no-files-found: error
