name: Build Wear

on:
  workflow_call:
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build-wear:
    name: Build wear release APK (armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve version (semantic name from VERSION, code from commit count)
        shell: bash
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "Building Messenger $(tr -d '[:space:]' < VERSION) ($(git rev-list --count HEAD))"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Decode keystore (push builds)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p keyring
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keyring/messenger-release.jks

      # wear/build.gradle.kts filters release to armeabi-v7a (ext["wearReleaseAbis"]):
      # Wear OS devices run a 64-bit kernel with a 32-bit userspace, so that is the
      # only ABI the watch APK ships — x86_64 is debug-only, for Wear OS AVDs.
      # R8 + resource shrinking are on for this release build.
      - name: Build wear release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: ./gradlew :wear:assembleRelease

      - name: Upload wear release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-release
          # No ABI splits any more: the watch release APK is a single
          # wear-release.apk with armeabi-v7a natives (see wear/build.gradle.kts).
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
