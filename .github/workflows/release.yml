name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-version:
    name: Validate release version before compiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The tag is the published identity of a release, so it must agree with
      # the VERSION file the artifacts were built from: a `v1.0.1` tag on a
      # tree whose VERSION still says 1.0.0 would ship every client reporting
      # 1.0.0 under a 1.0.1 release. Fail here instead.
      - name: Verify the tag matches the VERSION file
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ ! -f VERSION ]; then
            echo "::error::No VERSION file at the tagged commit ($tag). It is the single source of truth for the version name."
            exit 1
          fi
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "v$file" ]; then
            echo "::error::Tag '$tag' does not match VERSION '$file' (expected tag 'v$file')."
            echo "Bump the VERSION file and tag the commit that carries it."
            exit 1
          fi
          echo "Tag '$tag' matches VERSION '$file'."

  build-all:
    name: Build All
    needs: validate-version
    uses: ./.github/workflows/build-all.yml
    secrets: inherit

  release:
    name: Create GitHub Release
    permissions:
      contents: write
    needs: build-all
    runs-on: ubuntu-latest

    steps:
      # --- Android (arm64-v8a; wear is the armeabi-v7a exception) ---------
      - name: Download androidApp release artifact
        uses: actions/download-artifact@v4
        with:
          name: androidApp-release
          path: artifacts/androidApp

      - name: Download runtime release artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-release
          path: artifacts/runtime

      - name: Download wear release artifact
        uses: actions/download-artifact@v4
        with:
          name: wear-release
          path: artifacts/wear

      # Download the installers already built by the reusable Desktop workflow.
      - name: Download Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts/desktop

      # --- Release metadata ---------------------------------------------
      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/androidApp/**/*.apk
            artifacts/runtime/**/*.apk
            artifacts/wear/*.apk
            artifacts/desktop/desktop-windows-x86_64/*.msi
            artifacts/desktop/desktop-linux-x86_64/*.deb
            artifacts/desktop/desktop-linux-x86_64/*.pkg.tar.zst
            artifacts/desktop/desktop-macos-arm64/*.dmg
