[workspace]
resolver = "2"
members = [
    "crates/messenger-ffi",
    "crates/messenger-llm",
    "crates/messenger-tools",
    "crates/messenger-store",
    "crates/messenger-core",
    "crates/messenger-mcp",
    "crates/messenger-sync",
    "crates/messenger-document",
    "crates/messenger-markdown",
    "crates/messenger-highlight",
    "crates/messenger-wasm",
    "crates/messenger-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Used only for the host cdylib that uniffi-bindgen reads (see
# core/bindings/build.gradle.kts). That library must keep its symbol table:
# uniffi finds the UNIFFI_META_* metadata symbols by walking the ELF `.symtab`,
# which `strip = true` above removes — on Linux bindgen then exits 0 having
# discovered nothing, yielding an empty bindings directory. PE and Mach-O are
# unaffected (they read the export table and nlist respectively), which is why
# only the Linux CI job failed. Nothing ships this artifact: the Android
# jniLibs come from cargo-ndk targeting the Android triples and keep the
# stripped release profile, and the host library's only consumer is bindgen.
#
# Link-time optimization is deliberately OFF here. This artifact is never
# shipped or executed by users — bindgen only reads its metadata symbols — yet
# inheriting release's `lto = "thin"` + `codegen-units = 1` made a one-line
# edit in a sibling crate cost ~57 s to rebuild (and a full rebuild ~2 min).
# Dropping LTO and widening codegen units keeps the symbol table intact and
# cuts that to a plain optimized compile.
[profile.bindgen]
inherits = "release"
strip = "none"
lto = false
codegen-units = 16
