[workspace]
resolver = "2"
members = [
    "crates/messenger-ffi",
    "crates/messenger-http",
    "crates/messenger-llm",
    "crates/messenger-tools",
    "crates/messenger-store",
    "crates/messenger-core",
    "crates/messenger-mcp",
    "crates/messenger-remote",
    "crates/messenger-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `strip = "none"` is required, not cosmetic: uniffi discovers the
# UNIFFI_META_* symbols by walking the ELF `.symtab`, which the release
# profile's `strip = true` deletes — on Linux bindgen then exits 0 having found
# nothing and emits an empty bindings directory. PE and Mach-O are unaffected
# (they read the export table and nlist), which is why only Linux CI failed.
#
# DESKTOP DOES SHIP THIS: :core-bindings-desktop has exactly one profile —
# `bindgen` — and stages target/bindgen/<lib> into the jar as a JNA resource,
# so the desktop app runs this unstripped, non-LTO, codegen-units=16 build.
# Android's jniLibs come from cargo-ndk targeting the Android triples with the
# stripped `release` profile, so Android is unaffected.
#
# Link-time optimization is deliberately OFF here. Inheriting release's
# `lto = "thin"` + `codegen-units = 1` made a one-line edit in a sibling crate
# cost ~57 s to rebuild (and a full rebuild ~2 min), which is punishing for the
# inner loop because bindgen only reads metadata symbols.
# Dropping LTO and widening codegen units keeps the symbol table intact and
# cuts that to a plain optimized compile.
#
# Because the desktop release ships this profile, that inner-loop trade-off is
# also a shipping-performance decision. Shipping a separate optimized desktop
# library would need a second cargo build per desktop job (and a way to keep
# the symbol table, or generate bindings from a bindgen-profile copy). Not done
# yet; if desktop startup/throughput ever matters, this is the place to start.
[profile.bindgen]
inherits = "release"
strip = "none"
lto = false
codegen-units = 16
