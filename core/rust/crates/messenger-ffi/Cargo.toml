[package]
name = "messenger-ffi"
version.workspace = true
edition.workspace = true

[lib]
name = "messenger_ffi"
crate-type = ["lib", "cdylib"]

[dependencies]
# Only the native lifecycle bridge remains here. Business APIs are served by
# messenger-http over loopback REST/SSE.
uniffi = { version = "0.29", features = ["cli", "tokio"] }
messenger-http = { path = "../messenger-http" }
messenger-store = { path = "../messenger-store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
