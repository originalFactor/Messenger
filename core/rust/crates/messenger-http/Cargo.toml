[package]
name = "messenger-http"
version.workspace = true
edition.workspace = true
description = "Versioned loopback REST and SSE API for the Messenger Rust core"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
agent-client-protocol = "=3.3.0"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.24"
async-trait = "0.1"
futures-core = "0.3"
messenger-llm = { path = "../messenger-llm" }
messenger-core = { path = "../messenger-core" }
messenger-remote = { path = "../messenger-remote" }
messenger-store = { path = "../messenger-store" }
messenger-sync = { path = "../messenger-sync" }
messenger-tools = { path = "../messenger-tools" }
messenger-mcp = { path = "../messenger-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"
gix = { version = "0.90", default-features = false, features = ["sha1"] }
gix-pack = { version = "0.77", default-features = false, features = ["sha1", "streaming-input"] }
percent-encoding = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat", "codec"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
