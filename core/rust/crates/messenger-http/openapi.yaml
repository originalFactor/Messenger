openapi: 3.1.0
info:
  title: Messenger Rust Core API
  version: 1.0.0
  description: |
    Loopback-only JSON/SSE API used by the Android and Desktop clients.
    A fresh bearer token is generated for every server start. The server never
    binds to a non-loopback address.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  "/learning/settings":
    "get":
      "operationId": "getLearningCapability"
      "description": "Explicit device-local feature capability, initially disabled. Ordinary authenticated user CRUD remains available; Agent tools also require effective turn/Agent policy."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkbenchCapability"
    "put":
      "operationId": "setLearningCapability"
      "description": "Explicit device-local feature capability, initially disabled. Ordinary authenticated user CRUD remains available; Agent tools also require effective turn/Agent policy."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/WorkbenchCapability"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkbenchCapability"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Invalid local bearer credential."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/artifacts/settings":
    "get":
      "operationId": "getArtifactCapability"
      "description": "Explicit device-local feature capability, initially disabled. Ordinary authenticated user CRUD remains available; Agent tools also require effective turn/Agent policy."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkbenchCapability"
    "put":
      "operationId": "setArtifactCapability"
      "description": "Explicit device-local feature capability, initially disabled. Ordinary authenticated user CRUD remains available; Agent tools also require effective turn/Agent policy."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/WorkbenchCapability"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkbenchCapability"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Invalid local bearer credential."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/image-generation/capability":
    "get":
      "operationId": "getImageGenerationCapability"
      "description": "Explicit device-local feature capability, initially disabled. Ordinary authenticated user CRUD remains available; Agent tools also require effective turn/Agent policy."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkbenchCapability"
    "put":
      "operationId": "setImageGenerationCapability"
      "description": "Explicit device-local feature capability, initially disabled. Ordinary authenticated user CRUD remains available; Agent tools also require effective turn/Agent policy."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/WorkbenchCapability"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/WorkbenchCapability"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "401":
          "description": "Invalid local bearer credential."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/learning/overview":
    "get":
      "operationId": "learningOverview"
      "description": "Fact counts from the device-local library; never inferred mastery."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LearningOverview"
  "/learning/records/{kind}":
    "parameters":
      - "name": "kind"
        "in": "path"
        "required": true
        "schema":
          "$ref": "#/components/schemas/LearningKind"
      - "name": "courseId"
        "in": "query"
        "schema":
          "type": "string"
      - "name": "knowledgePointId"
        "in": "query"
        "schema":
          "type": "string"
      - "name": "tag"
        "in": "query"
        "schema":
          "type": "string"
      - "name": "search"
        "in": "query"
        "schema":
          "type": "string"
      - "name": "archived"
        "in": "query"
        "schema":
          "type": "boolean"
      - "name": "dueBefore"
        "in": "query"
        "schema":
          "type": "integer"
          "format": "int64"
          "description": "UTC milliseconds; filters unpaused, unarchived cards and sorts earliest due first."
      - "name": "offset"
        "in": "query"
        "schema":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "default": 0
      - "name": "limit"
        "in": "query"
        "schema":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "maximum": 200
          "default": 50
    "get":
      "operationId": "listLearningRecords"
      "description": "Filter and paginate typed records. Tasks and knowledge points sort by saved position then ID before pagination; other lists sort newest update first, and due reviews sort earliest due first. Source snapshots survive chat deletion; missing normal chat/message hints detach on read."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LearningPage"
  "/learning/records/{kind}/{id}":
    "parameters":
      - "name": "kind"
        "in": "path"
        "required": true
        "schema":
          "$ref": "#/components/schemas/LearningKind"
      - "$ref": "#/components/parameters/Id"
    "get":
      "operationId": "getLearningRecord"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LearningRecord"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "put":
      "operationId": "putLearningRecord"
      "description": "Path id/kind must match payload. Version zero creates; current version updates. Maximum record JSON 1 MiB. Typed references and knowledge-point cycles validate in the same transaction."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LearningRecord"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LearningRecord"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Version, request ID, or relation conflict."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "delete":
      "operationId": "deleteLearningRecord"
      "description": "Delete only after dependents are removed; archive referenced records instead. Deletes the record and its own content revisions and atomically releases its asset owners. Other owners and resources required by immutable review-attempt snapshots remain; otherwise unreferenced resources enter the 24-hour GC grace period."
      "responses":
        "204":
          "description": "Completed."
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Version, request ID, or relation conflict."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        - "name": "version"
          "in": "query"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
  "/learning/reviews/{id}/state":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "get":
      "operationId": "getLearningReviewState"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewState"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/learning/reviews/{id}/submit":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "post":
      "operationId": "submitLearningReview"
      "description": "Explicit user feedback only. again/hard/good/easy map to SM-2 quality 1/3/4/5. Snapshot, attempt and schedule update atomically. Globally idempotent submissionId; identical repeats return the original attempt, different input conflicts. Check itemVersion and stateVersion; paused/archived cards reject new attempts. No Agent tool or webpage can auto-grade."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ReviewSubmission"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewAttempt"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Version, request ID, or relation conflict."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/learning/reviews/{id}/attempts":
    "parameters":
      - "$ref": "#/components/parameters/Id"
      - "name": "offset"
        "in": "query"
        "schema":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "default": 0
      - "name": "limit"
        "in": "query"
        "schema":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "maximum": 200
          "default": 50
    "get":
      "operationId": "listLearningReviewAttempts"
      "description": "Immutable history, newest first; missing/deleted cards may still have attempts."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "items":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/ReviewAttempt"
                "required": ["items"]
  "/learning/export":
    "get":
      "operationId": "exportLearningMetadata"
      "description": "Metadata only: records, immutable revisions, states and attempts. External asset/artifact bytes are explicitly omitted. Use /learning/package/export for complete resources."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LearningPackage"
  "/learning/import/preview":
    "post":
      "operationId": "previewLearningMetadata"
      "description": "Validate all records/relations/revisions/states/attempts; preview rolls back exactly the same transaction as commit. Preserve IDs and reject collisions. Referenced asset bytes and artifacts must already exist locally; complete package imports supply missing resources. Limits: 16 MiB JSON, 10000 records/states, 50000 revisions/attempts. No credentials, permissions or external resource bytes."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LearningPackage"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LearningImportPreview"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Version, request ID, or relation conflict."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Request exceeds bounded JSON limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/learning/import":
    "post":
      "operationId": "importLearningMetadata"
      "description": "Validate all records/relations/revisions/states/attempts; preview rolls back exactly the same transaction as commit. Preserve IDs and reject collisions. Referenced asset bytes and artifacts must already exist locally; complete package imports supply missing resources. Limits: 16 MiB JSON, 10000 records/states, 50000 revisions/attempts. No credentials, permissions or external resource bytes."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/LearningPackage"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/LearningImportPreview"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Version, request ID, or relation conflict."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Request exceeds bounded JSON limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/assets":
    "get":
      "operationId": "listAssets"
      "description": "Device-local owned content manifest, no paths or credentials."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/Asset"
  "/assets/import":
    "post":
      "operationId": "importAsset"
      "description": "Decode, validate and atomically persist independent asset bytes before committing ownership metadata. SHA-256 deduplication. Maximum 20 MiB per file, 29 MiB JSON; PNG/JPEG/WebP require matching decoded MIME and bounded dimensions."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AssetImport"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Asset"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "413":
          "description": "Request exceeds bounded JSON limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/assets/download":
    "post":
      "operationId": "downloadAsset"
      "description": "Public HTTPS only; DNS/address pinning and every redirect are checked. Maximum 20 MiB, 60 seconds, three redirects; no ambient proxy or retries."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AssetDownload"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Asset"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/assets/{id}":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "get":
      "operationId": "getAsset"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Asset"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/assets/{id}/provenance":
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getAssetGenerationProvenance
      description: Portable generated-image provenance only; no provider credentials, endpoints, profiles or runnable jobs.
      responses:
        "200":
          description: At most 128 provenance entries for the owned asset.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ImageProvenance' } }
        "404": { description: Asset not found. }
  "/assets/{id}/content":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "get":
      "operationId": "getAssetContent"
      "description": "Authenticated binary download. Content-Disposition attachment, X-Content-Type-Options nosniff, Cache-Control private/no-store. Generated webpages must not receive Core credentials."
      "responses":
        "200":
          "description": "Asset bytes with recorded MIME."
          "content":
            "application/octet-stream":
              "schema":
                "type": "string"
                "format": "binary"
        "404":
          "description": "Asset not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/assets/{id}/references":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "post":
      "operationId": "addAssetReference"
      "description": "Explicit ownership mutation; release rejects a still-bound material, artifact, or active/result-owning image job. Unreferenced bytes have a 24-hour GC grace period."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AssetReference"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Asset"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/assets/{id}/unreference":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "post":
      "operationId": "releaseAssetReference"
      "description": "Explicit ownership mutation; release rejects a still-bound material, artifact, or active/result-owning image job. Unreferenced bytes have a 24-hour GC grace period."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/AssetReference"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Asset"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/assets/gc":
    "post":
      "operationId": "collectUnreferencedAssets"
      "description": "Explicit GC of unreferenced assets after 24 hours and old hash-named orphan files. Referenced assets remain."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "removed":
                    "type": "integer"
                    "format": "int64"
                "required": ["removed"]
  "/image-generation/profiles":
    "get":
      "operationId": "listImageGenerationProfiles"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/ImageGenerationProfile"
  "/image-generation/profiles/{id}":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "put":
      "operationId": "putImageGenerationProfile"
      "description": "Path/payload IDs must match. Explicit BYOK OpenAI-compatible Images API adapter; no capability inferred from chat protocols/modalities. Built-in Cloud provider remains ineligible without explicit generation support."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ImageGenerationProfile"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImageGenerationProfile"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
    "delete":
      "operationId": "deleteImageGenerationProfile"
      "description": "Remove profile while retaining jobs and result assets."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "deleted":
                    "const": true
                "required": ["deleted"]
  "/image-generation/jobs":
    "get":
      "operationId": "listImageGenerationJobs"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/ImageGenerationJob"
    "post":
      "operationId": "submitImageGeneration"
      "description": "Capability and valid profile/provider/key/model are required before creating a potentially paid job. Identical requestId/content returns existing job even after profile deletion. Different input with same ID conflicts. One request, no automatic retries, alternate endpoint or provider fallback; unknown outcomes require a new user retry ID."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/GenerateImageRequest"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImageGenerationJob"
        "400":
          "description": "Invalid input or rejected import."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "409":
          "description": "Version, request ID, or relation conflict."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/image-generation/jobs/{id}":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "get":
      "operationId": "getImageGenerationJob"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImageGenerationJob"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/image-generation/jobs/{id}/cancel":
    "parameters":
      - "$ref": "#/components/parameters/Id"
    "post":
      "operationId": "cancelImageGenerationJob"
      "description": "Abort locally. Provider may already have generated/charged. Cancelled/unknown work is never automatically resubmitted."
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ImageGenerationJob"
        "404":
          "description": "Resource not found."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/artifacts":
    "get":
      "operationId": "listArtifacts"
      "responses":
        "200":
          "description": "Authoritative local JSON state."
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "items":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/ArtifactSummary"
                "required": ["items"]
    "post":
      "operationId": "createArtifact"
