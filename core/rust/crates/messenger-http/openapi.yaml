      requestBody: { $ref: "#/components/requestBodies/Model" }
      responses: { "200": { $ref: "#/components/responses/Model" }, "409": { description: Built-in catalog is read-only } }
    delete:
      operationId: deleteModel
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      responses: { "204": { description: Deleted }, "409": { description: Built-in catalog is read-only } }
  /models/{id}/enabled:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setModelEnabled
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses: { "204": { description: Updated }, "409": { description: Built-in catalog is read-only } }
  /models/discover:
    post:
      operationId: discoverProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl, apiKey]
              properties:
                baseUrl: { type: string }
                apiKey: { type: string }
                apiFormat: { type: [string, "null"] }
                skipCatalog: { type: boolean, default: false, description: Skip models.dev enrichment and return provider-supplied metadata. }
      responses: { "200": { description: Discovered model list with optional provider capability metadata, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /models/metadata/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: modelMetadata
      responses: { "200": { description: Metadata object or null, content: { application/json: { schema: { type: [object, "null"] } } } } }
  /agents:
    get:
      operationId: listAgents
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/AgentPage" } }
    put:
      operationId: upsertAgent
      requestBody: { $ref: "#/components/requestBodies/Agent" }
      responses: { "200": { $ref: "#/components/responses/Agent" } }
  /agents/default:
    get:
      operationId: getDefaultAgent
      responses: { "200": { $ref: "#/components/responses/Agent" }, "404": { $ref: "#/components/responses/NotFound" } }
  /agents/title:
    get:
      operationId: getTitleAgent
      responses: { "200": { $ref: "#/components/responses/Agent" }, "404": { $ref: "#/components/responses/NotFound" } }
  /agents/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getAgent
      responses: { "200": { $ref: "#/components/responses/Agent" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceAgent
      requestBody: { $ref: "#/components/requestBodies/Agent" }
      responses: { "200": { $ref: "#/components/responses/Agent" } }
    delete:
      operationId: deleteAgent
      description: The row with `is_default=true` is protected by the core invariant.
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/GameConflict" } }
  /agents/{id}/conversations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listAgentConversations
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ConversationPage" } }
  /projects:
    get:
      operationId: listProjects
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ProjectPage" } }
    put:
      operationId: upsertProject
      requestBody: { $ref: "#/components/requestBodies/Project" }
      responses: { "200": { $ref: "#/components/responses/Project" } }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getProject
      responses: { "200": { $ref: "#/components/responses/Project" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceProject
      requestBody: { $ref: "#/components/requestBodies/Project" }
      responses: { "200": { $ref: "#/components/responses/Project" } }
    delete:
      operationId: deleteProject
      responses: { "204": { description: Deleted } }
  /projects/{id}/conversations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listProjectConversations
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ConversationPage" } }
  /conversations:
    get:
      operationId: listConversations
      description: Includes device-local ACP session projections (acp-prefixed IDs) alongside Messenger conversations. ACP rows never enter Cloud sync.
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ConversationPage" } }
    put:
      operationId: upsertConversation
      requestBody: { $ref: "#/components/requestBodies/Conversation" }
      responses: { "200": { $ref: "#/components/responses/Conversation" } }
  /conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getConversation
      responses: { "200": { $ref: "#/components/responses/Conversation" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceConversation
      requestBody: { $ref: "#/components/requestBodies/Conversation" }
      responses: { "200": { $ref: "#/components/responses/Conversation" } }
    delete:
      operationId: deleteConversation
      responses: { "204": { description: Deleted } }
  /conversations/{id}/last-message:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateConversationLastMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updatedAt]
              properties:
                lastMessage: { type: [string, "null"] }
                updatedAt: { type: integer, format: int64 }
      responses: { "204": { description: Updated } }
  /conversations/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listMessages
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: beforeId, in: query, schema: { type: string } }
        - { name: fromId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Message window in chronological order.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  total: { type: integer }
                  nextBeforeId: { type: [string, "null"] }
    post:
      operationId: chat
      description: |
        Starts a chat turn. `send` inserts a user message; `retry` and
        `regenerate` reference an existing message; `continue` starts from the
        already-persisted context. If no model is configured the request fails
        with 409 `model_required` before any row changes. A conversation of a
        project owned by another device needs that device online: otherwise
        the request fails with 409 `project_unavailable` (also before any row
        changes). While it is online the project's workspace tools execute on
        the owner and never produce `ToolCallRequested` locally.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Chat event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "409": { $ref: "#/components/responses/GameConflict" }
    delete:
      operationId: deleteConversationMessages
      responses: { "204": { description: Deleted } }
  /conversations/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelTurn
      responses: { "202": { description: Cancellation requested }, "404": { $ref: "#/components/responses/NotFound" } }
  /turns/tools/{callId}/result:
    parameters: [{ name: callId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: resolveToolCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output, isError]
              properties:
                output: { type: string }
                isError: { type: boolean }
                structuredContent: { $ref: "#/components/schemas/StructuredToolContent" }
      responses: { "202": { description: Result delivered }, "404": { $ref: "#/components/responses/NotFound" } }
  /messages/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMessage
      responses: { "200": { $ref: "#/components/responses/Message" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceMessage
      requestBody: { $ref: "#/components/requestBodies/Message" }
      responses: { "200": { $ref: "#/components/responses/Message" } }
    delete:
      operationId: deleteMessage
      responses: { "204": { description: Deleted } }
  /kv/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      operationId: kvGet
      responses: { "200": { description: JSON string or null } }
    put:
      operationId: kvSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], properties: { value: { type: string } } }
      responses: { "204": { description: Updated } }
    delete:
      operationId: kvDelete
      responses: { "204": { description: Deleted } }
  /changes:
    post:
      operationId: markCloudChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id, deleted]
              properties:
                kind: { type: string }
                id: { type: string }
                deleted: { type: boolean }
      responses: { "204": { description: Queued } }
  /migration/import:
    post:
      operationId: importLegacyRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legacyDbDir]
              properties:
                legacyDbDir: { type: string }
                nowMs: { type: integer, format: int64 }
      responses: { "200": { description: "Import summary or `{imported:false}`" } }
  /cloud/login:
    post:
      operationId: cloudLogin
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses: { "200": { description: Cloud user }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/register:
    post:
      operationId: cloudRegister
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses: { "200": { description: Cloud user }, "4XX": { $ref: "#/components/responses/CloudError" } }
  /cloud/logout:
    post:
      operationId: cloudLogout
      responses: { "204": { description: Signed out } }
  /cloud/refresh:
    post:
      operationId: cloudRefresh
      responses: { "200": { description: Refreshed user }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/me:
    get:
      operationId: cloudCurrentUser
      responses: { "200": { description: Cloud user or null } }
  /cloud/server-url:
    get:
      operationId: cloudGetServerUrl
      responses: { "200": { description: JSON string } }
    put:
      operationId: cloudSetServerUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string } } }
      responses: { "204": { description: Updated } }
  /cloud/has-local-data:
    get:
      operationId: cloudHasLocalData
      responses: { "200": { description: Boolean } }
  /cloud/sync:
    post:
      operationId: cloudSync
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { replaceLocal: { type: boolean, default: false } } }
      responses: { "200": { description: Sync result }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/sync-with:
    post:
      operationId: cloudSyncWith
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                since: { type: [integer, "null"], format: int64 }
                replaceLocal: { type: boolean }
                expectedServerVersion: { type: [integer, "null"], format: int64 }
      responses: { "200": { description: Sync result }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/push-pending:
    post:
      operationId: cloudPushPending
      responses: { "200": { description: Sync result } }
  /cloud/conversations/push:
    post:
      operationId: cloudUploadConversations
      description: Upload finalized standalone TUI conversations. Supply a conversation ID after a turn. Omit the ID to explicitly upload eligible history. Bound conversations stay with their original server and account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId: { type: [string, "null"] }
                claimNew: { type: boolean, default: false, description: Bind a newly created conversation to the current signed-in account. }
      responses:
        "200":
          description: Counts of uploaded, skipped, and conflicting conversations.
          content:
            application/json:
              schema:
                type: object
                required: [uploaded, skipped, conflicts]
                properties:
                  uploaded: { type: integer }
                  skipped: { type: integer }
                  conflicts: { type: integer }
        "401": { $ref: "#/components/responses/CloudError" }
  /cloud/push-snapshot:
    post:
      operationId: cloudPushSnapshot
      responses: { "200": { description: Server version number } }
  /cloud/replace-cloud-with-local:
    post:
      operationId: cloudReplaceCloudWithLocal
      responses: { "200": { description: Sync result } }
  /cloud/cards/preview:
    post:
      operationId: previewCard
      requestBody: { $ref: "#/components/requestBodies/CardCode" }
      responses: { "200": { description: Card preview } }
  /cloud/cards/redeem:
    post:
      operationId: redeemCard
      requestBody: { $ref: "#/components/requestBodies/CardCode" }
      responses: { "200": { description: Redemption result } }
  /cloud/builtin-models/sync:
    post:
      operationId: syncBuiltinModels
      description: Provision Messenger Cloud AI from the saved account and synchronize its authoritative catalog and Messenger Extended Models Protocol metadata from /v1/models, without models.dev enrichment or local overrides. Returns zero when the account has no AI key.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { force: { type: boolean } } }
      responses: { "200": { description: Number of synchronized models } }
  /cloud/ensure-title-agent:
    post:
      operationId: ensureTitleAgent
      responses: { "204": { description: Seeded } }
  /cloud/change-password:
    post:
      operationId: changePassword
      requestBody: { $ref: "#/components/requestBodies/PasswordChange" }
      responses: { "204": { description: Updated }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/account:
    delete:
      operationId: deleteCloudAccount
      requestBody: { $ref: "#/components/requestBodies/CurrentPassword" }
      responses: { "204": { description: Deleted } }
  /cloud/cache-avatar:
    post:
      operationId: cacheAvatar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [scope, accountId, id, url, destDir]
              properties:
                scope: { type: string }
                accountId: { type: string }
                id: { type: string }
                url: { type: string }
                version: { type: [string, "null"] }
                destDir: { type: string }
      responses: { "200": { description: Cached file path as JSON string } }
  /cloud/avatars/user:
    post:
      operationId: uploadUserAvatar
      requestBody: { $ref: "#/components/requestBodies/Avatar" }
      responses: { "200": { description: Avatar URL as JSON string } }
    delete:
      operationId: deleteUserAvatar
      responses: { "200": { description: Avatar URL as JSON string } }
  /cloud/avatars/agents/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: uploadAgentAvatar
      requestBody: { $ref: "#/components/requestBodies/Avatar" }
      responses: { "200": { description: Avatar URL as JSON string } }
    delete:
      operationId: deleteAgentAvatar
      responses: { "200": { description: Avatar URL as JSON string } }
  /cloud/market:
    get:
      operationId: listMarketAgents
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: Market page } }
  /cloud/market/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMarketAgent
      responses: { "200": { description: Market agent } }
    delete:
      operationId: removeMarketAgent
      responses: { "204": { description: Removed } }
  /cloud/market/publish/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: publishMarketAgent
      responses: { "200": { description: Published market agent } }
  /cloud/market/import/{marketId}:
    parameters: [{ name: marketId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: importMarketAgent
      responses: { "200": { description: Imported agent } }
  /cloud/market/import-avatar/{marketId}:
    parameters: [{ name: marketId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: importMarketAgentWithAvatar
      responses: { "200": { description: Imported agent } }
  /cloud/market/update/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: pushMarketAgentUpdate
      responses: { "200": { description: Updated market agent } }
  /cloud/market/check/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: checkMarketAgentUpdate
      responses: { "200": { description: Update availability } }
  /cloud/market/apply/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: applyMarketAgentUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [market], properties: { market: { type: object } } }
      responses: { "200": { description: Updated local agent } }
  /cloud/market-links:
    delete:
      operationId: clearMarketLinks
      responses: { "204": { description: Cleared } }
  /local-data:
    delete:
      operationId: clearLocalData
      description: Explicit reset path; re-seed the default Agent afterwards.
      responses: { "204": { description: Cleared } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-start token returned to the app shell by the native lifecycle bridge.
  parameters:
    ControlRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  schemas:
    "WorkbenchCapability":
      "type": "object"
      "properties":
        "enabled":
          "type": "boolean"
          "default": false
      "required": ["enabled"]
      "additionalProperties": false
    "LearningKind":
      "type": "string"
      "enum": ["course","knowledgePoint","item","material","plan","task","reviewCard"]
    "LearningSource":
      "type": "object"
      "properties":
        "kind":
          "type": "string"
          "enum": ["chat","acp","manual","import"]
        "conversationId":
          "anyOf":
            - "type": "string"
            - "type": "null"
        "messageIds":
          "type": "array"
          "items":
            "type": "string"
        "snapshot":
          "type": "string"
        "assetIds":
          "type": "array"
          "items":
            "type": "string"
      "required": ["kind","snapshot"]
      "additionalProperties": false
    "LearningContent":
      "discriminator":
        "propertyName": "kind"
      "oneOf":
        - "type": "object"
          "properties":
            "kind":
              "const": "course"
            "description":
              "type": "string"
          "required": ["kind"]
          "additionalProperties": false
        - "type": "object"
          "properties":
            "kind":
              "const": "knowledgePoint"
            "parentId":
              "anyOf":
                - "type": "string"
                - "type": "null"
            "description":
              "type": "string"
            "position":
              "type": "integer"
              "format": "int64"
          "required": ["kind"]
          "additionalProperties": false
        - "type": "object"
          "properties":
            "kind":
              "const": "item"
            "itemKind":
              "type": "string"
              "enum": ["mistake","note","exercise"]
            "question":
              "type": "string"
            "originalAnswer":
              "type": "string"
            "correctAnswer":
              "type": "string"
            "explanation":
              "type": "string"
            "errorReason":
              "type": "string"
          "required": ["kind","itemKind"]
          "additionalProperties": false
        - "type": "object"
          "properties":
            "kind":
              "const": "material"
            "materialKind":
              "type": "string"
              "enum": ["text","image","file","link","artifact"]
            "text":
              "type": "string"
            "url":
              "anyOf":
                - "type": "string"
                - "type": "null"
            "assetId":
              "anyOf":
                - "type": "string"
                - "type": "null"
            "artifactId":
              "anyOf":
                - "type": "string"
                - "type": "null"
          "required": ["kind","materialKind"]
          "additionalProperties": false
        - "type": "object"
          "properties":
            "kind":
              "const": "plan"
            "goal":
              "type": "string"
            "targetAt":
              "anyOf":
                - "type": "integer"
                  "format": "int64"
                - "type": "null"
          "required": ["kind"]
          "additionalProperties": false
        - "type": "object"
          "properties":
            "kind":
              "const": "task"
            "planId":
              "type": "string"
            "itemId":
              "anyOf":
                - "type": "string"
                - "type": "null"
            "status":
              "type": "string"
              "enum": ["pending","inProgress","completed"]
            "position":
              "type": "integer"
              "format": "int64"
            "dueAt":
              "anyOf":
                - "type": "integer"
                  "format": "int64"
                - "type": "null"
          "required": ["kind","planId","status"]
          "additionalProperties": false
        - "type": "object"
          "properties":
            "kind":
              "const": "reviewCard"
            "itemId":
              "type": "string"
            "paused":
              "type": "boolean"
              "default": false
          "required": ["kind","itemId"]
          "additionalProperties": false
    "LearningRecord":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "default": 0
          "description": "Zero creates; updates carry the current version. Server increments it."
        "createdAt":
          "type": "integer"
          "format": "int64"
          "description": "UTC milliseconds; server-owned on ordinary writes."
        "updatedAt":
          "type": "integer"
          "format": "int64"
        "title":
          "type": "string"
          "minLength": 1
          "maxLength": 1024
        "courseId":
          "anyOf":
            - "type": "string"
            - "type": "null"
        "knowledgePointIds":
          "type": "array"
          "items":
            "type": "string"
        "tags":
          "type": "array"
          "items":
            "type": "string"
        "archived":
          "type": "boolean"
          "default": false
        "source":
          "anyOf":
            - "$ref": "#/components/schemas/LearningSource"
            - "type": "null"
        "content":
          "$ref": "#/components/schemas/LearningContent"
      "required": ["id","title","content"]
      "additionalProperties": false
    "LearningPage":
      "type": "object"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/LearningRecord"
        "total":
          "type": "integer"
          "format": "int64"
        "offset":
          "type": "integer"
          "format": "int64"
        "limit":
          "type": "integer"
          "format": "int64"
      "required": ["items","total","offset","limit"]
    "LearningOverview":
      "type": "object"
      "properties":
        "courses":
          "type": "integer"
          "format": "int64"
        "items":
          "type": "integer"
          "format": "int64"
        "materials":
          "type": "integer"
          "format": "int64"
        "dueReviews":
          "type": "integer"
          "format": "int64"
        "pendingTasks":
          "type": "integer"
          "format": "int64"
        "completedTasks":
          "type": "integer"
          "format": "int64"
        "attempts":
          "type": "integer"
          "format": "int64"
        "localOnly":
          "const": true
      "required": ["courses","items","materials","dueReviews","pendingTasks","completedTasks","attempts","localOnly"]
    "ReviewState":
      "type": "object"
      "properties":
        "cardId":
          "type": "string"
        "version":
          "type": "integer"
          "format": "int64"
        "intervalDays":
          "type": "integer"
          "format": "int64"
        "repetitions":
          "type": "integer"
          "format": "int64"
        "ease":
          "type": "number"
          "minimum": 1.3
        "dueAt":
          "type": "integer"
          "format": "int64"
        "lastReviewedAt":
          "anyOf":
            - "type": "integer"
              "format": "int64"
            - "type": "null"
        "algorithm":
          "const": "sm2-v1"
      "required": ["cardId","version","intervalDays","repetitions","ease","dueAt","lastReviewedAt","algorithm"]
    "ReviewSubmission":
      "type": "object"
      "properties":
        "submissionId":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "cardId":
          "type": "string"
        "itemVersion":
          "type": "integer"
          "format": "int64"
        "stateVersion":
          "type": "integer"
          "format": "int64"
        "answer":
          "type": "string"
        "rating":
          "type": "string"
          "enum": ["again","hard","good","easy"]
      "required": ["submissionId","cardId","itemVersion","stateVersion","answer","rating"]
      "additionalProperties": false
    "ReviewAttempt":
      "type": "object"
      "properties":
        "submission":
          "$ref": "#/components/schemas/ReviewSubmission"
        "createdAt":
          "type": "integer"
          "format": "int64"
        "itemSnapshot":
          "$ref": "#/components/schemas/LearningRecord"
        "state":
          "$ref": "#/components/schemas/ReviewState"
      "required": ["submission","createdAt","itemSnapshot","state"]
    "LearningPackage":
      "type": "object"
      "properties":
        "formatVersion":
          "const": 1
        "records":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/LearningRecord"
        "revisions":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/LearningRecord"
        "reviewStates":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ReviewState"
        "attempts":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ReviewAttempt"
        "externalResourcesIncluded":
          "const": false
      "required": ["formatVersion","records","revisions","reviewStates","attempts","externalResourcesIncluded"]
      "additionalProperties": false
    "LearningImportPreview":
      "type": "object"
      "properties":
        "records":
          "type": "integer"
          "format": "int64"
        "revisions":
          "type": "integer"
          "format": "int64"
        "attempts":
          "type": "integer"
          "format": "int64"
        "externalResourcesIncluded":
          "const": false
        "warnings":
          "type": "array"
          "items":
            "type": "string"
      "required": ["records","revisions","attempts","externalResourcesIncluded","warnings"]
    "AssetReference":
      "type": "object"
      "properties":
        "ownerType":
          "type": "string"
        "ownerId":
          "type": "string"
      "required": ["ownerType","ownerId"]
      "additionalProperties": false
    "Asset":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
        "sha256":
          "type": "string"
          "pattern": "^[0-9a-f]{64}$"
        "mimeType":
          "type": "string"
        "size":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "maximum": 20971520
        "width":
          "anyOf":
            - "type": "integer"
              "format": "int64"
            - "type": "null"
        "height":
          "anyOf":
            - "type": "integer"
              "format": "int64"
            - "type": "null"
        "createdAt":
          "type": "integer"
          "format": "int64"
        "references":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/AssetReference"
        "unreferencedAt":
          "anyOf":
            - "type": "integer"
              "format": "int64"
            - "type": "null"
      "required": ["id","sha256","mimeType","size","width","height","createdAt","references"]
    "AssetImport":
      "type": "object"
      "properties":
        "dataBase64":
          "type": "string"
          "contentEncoding": "base64"
        "mimeType":
          "type": "string"
        "owner":
          "$ref": "#/components/schemas/AssetReference"
      "required": ["dataBase64","mimeType","owner"]
      "additionalProperties": false
    "AssetDownload":
      "type": "object"
      "properties":
        "url":
          "type": "string"
          "format": "uri"
          "description": "Public HTTPS port 443; every resolved address and redirect is checked."
        "owner":
          "$ref": "#/components/schemas/AssetReference"
      "required": ["url","owner"]
      "additionalProperties": false
    "ArtifactSubmission":
      "type": "object"
      "properties":
        "id":
          "anyOf":
            - "type": "string"
            - "type": "null"
        "title":
          "type": "string"
          "minLength": 1
          "maxLength": 240
        "description":
          "type": "string"
          "maxLength": 4000
        "files":
          "type": "object"
          "additionalProperties":
            "type": "string"
          "minProperties": 1
          "maxProperties": 128
        "assets":
          "type": "object"
          "additionalProperties":
            "type": "string"
          "maxProperties": 64
          "description": "Map safe relative paths to existing asset SHA-256 IDs."
        "entry":
          "type": "string"
          "default": "index.html"
        "expectedRevision":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "default": 0
        "stateVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "default": 0
        "requestedDomains":
          "type": "array"
          "items":
            "type": "string"
          "maxItems": 16
      "required": ["title","files"]
      "additionalProperties": false
    "ArtifactRevision":
      "type": "object"
      "properties":
        "revision":
          "type": "integer"
          "format": "int64"
        "files":
          "type": "object"
          "additionalProperties":
            "type": "string"
        "assets":
          "type": "object"
          "additionalProperties":
            "type": "string"
        "entry":
          "type": "string"
        "createdAt":
          "type": "integer"
          "format": "int64"
        "stateVersion":
          "type": "integer"
          "format": "int64"
      "required": ["revision","files","entry","createdAt"]
    "Artifact":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "title":
          "type": "string"
        "description":
          "type": "string"
        "revisions":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ArtifactRevision"
          "maxItems": 32
        "requestedDomains":
          "type": "array"
          "items":
            "type": "string"
        "approvedDomains":
          "type": "array"
          "items":
            "type": "string"
        "state": {}
        "stateVersion":
          "type": "integer"
          "format": "int64"
        "trustedOnDevice":
          "type": "boolean"
          "default": false
        "createdAt":
          "type": "integer"
          "format": "int64"
        "updatedAt":
          "type": "integer"
          "format": "int64"
      "required": ["id","title","revisions","createdAt","updatedAt"]
    "ArtifactSummary":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "title":
          "type": "string"
        "description":
          "type": "string"
        "revision":
          "anyOf":
            - "type": "integer"
              "format": "int64"
            - "type": "null"
        "updatedAt":
          "type": "integer"
          "format": "int64"
      "required": ["id","title","description","revision","updatedAt"]
    "ArtifactState":
      "type": "object"
      "properties":
        "stateVersion":
          "type": "integer"
          "format": "int64"
        "state": {}
        "revision":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "description": "Optional on submission; if present must match latest revision."
      "required": ["stateVersion","state"]
    "ArtifactGrants":
      "type": "object"
      "properties":
        "domains":
          "type": "array"
          "items":
            "type": "string"
      "required": ["domains"]
    "ArtifactFetch":
      "type": "object"
      "properties":
        "url":
          "type": "string"
        "method":
          "type": "string"
          "enum": ["GET","POST"]
          "default": "GET"
        "body":
          "anyOf":
            - "type": "string"
              "maxLength": 65536
            - "type": "null"
        "contentType":
          "anyOf":
            - "type": "string"
              "enum": ["application/json","text/plain","application/x-www-form-urlencoded"]
            - "type": "null"
      "required": ["url"]
      "additionalProperties": false
    "ArtifactFetchResult":
      "type": "object"
      "properties":
        "status":
          "type": "integer"
          "format": "int64"
        "body":
          "type": "string"
          "description": "UTF-8 response, maximum 1 MiB."
      "required": ["status","body"]
    "ImageGenerationProfile":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "name":
          "type": "string"
        "providerId":
          "type": "string"
        "modelId":
          "type": "string"
          "description": "Explicit remote generation model, independent of chat model rows."
        "adapter":
          "type": "string"
          "const": "openai_images"
          "default": "openai_images"
        "enabled":
          "type": "boolean"
          "default": false
        "supportedParameters":
          "type": "array"
          "items":
            "type": "string"
            "enum": ["n","size","quality","style","response_format","background","output_format","output_compression","moderation"]
        "defaults":
          "type": "object"
      "required": ["id","name","providerId","modelId"]
      "additionalProperties": false
    "GenerateImageRequest":
      "type": "object"
      "properties":
        "requestId":
          "type": "string"
        "profileId":
          "type": "string"
        "prompt":
          "type": "string"
        "parameters":
          "type": "object"
      "required": ["requestId","profileId","prompt"]
      "additionalProperties": false
    "ImageGenerationJob":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "request":
          "$ref": "#/components/schemas/GenerateImageRequest"
        "profile":
          "$ref": "#/components/schemas/ImageGenerationProfile"
        "parameters":
          "type": "object"
        "status":
          "type": "string"
          "enum": ["queued","running","succeeded","failed","cancelled","unknown"]
        "createdAt":
          "type": "integer"
          "format": "int64"
        "updatedAt":
          "type": "integer"
          "format": "int64"
        "assetIds":
          "type": "array"
          "items":
            "type": "string"
        "error":
          "anyOf":
            - "type": "string"
            - "type": "null"
        "usage": {}
        "revisedPrompts":
          "type": "array"
          "items":
            "anyOf":
              - "type": "string"
              - "type": "null"
      "required": ["id","request","profile","parameters","status","createdAt","updatedAt","assetIds","error","usage"]
    ImageProvenance:
      type: object
      additionalProperties: false
      required: [prompt, modelId, parameters, createdAt, completedAt]
      description: Sanitized portable generation facts; parameters use the Images API allowlist. At most 128 entries per asset. Times are nonnegative UTC milliseconds and completedAt must not precede createdAt.
      properties:
        prompt: { type: string, minLength: 1, maxLength: 32000 }
        modelId: { type: string, minLength: 1, maxLength: 256 }
        parameters: { type: object }
        revisedPrompt: { type: [string, "null"], maxLength: 32000 }
        createdAt: { type: integer, format: int64, minimum: 0 }
        completedAt: { type: integer, format: int64, minimum: 0 }
        usage:
          type: [object, number, "null"]
          description: Numeric counters only. Nested objects depth at most 4, at most 64 keys per object, ASCII alphanumeric/underscore keys up to 64 bytes, maximum 8192 encoded bytes. No strings, arrays, credentials or provider URLs.
    "LearningBundleAsset":
      "type": "object"
      "properties":
        "metadata":
          "$ref": "#/components/schemas/Asset"
        "dataBase64":
          "type": "string"
          "contentEncoding": "base64"
      "required": ["metadata","dataBase64"]
      "additionalProperties": false
    "LearningBundle":
      "type": "object"
      "properties":
        "formatVersion":
          "const": 1
        "learning":
          "$ref": "#/components/schemas/LearningPackage"
        "assets":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/LearningBundleAsset"
          "maxItems": 10000
        "artifacts":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Artifact"
          "maxItems": 1000
        generationProvenance:
          type: object
          default: {}
          description: Optional asset SHA-256 to sanitized provenance map. Keys must identify included assets; matching entries merge with existing local provenance.
          additionalProperties:
            type: array
            maxItems: 128
            items: { $ref: '#/components/schemas/ImageProvenance' }
      "required": ["formatVersion","learning","assets","artifacts"]
      "additionalProperties": false
    "LearningBundlePreview":
      "type": "object"
      "properties":
        "formatVersion":
          "const": 1
        "records":
          "type": "integer"
          "format": "int64"
        "revisions":
          "type": "integer"
          "format": "int64"
        "attempts":
          "type": "integer"
          "format": "int64"
        "assetCount":
          "type": "integer"
          "format": "int64"
        "assetBytes":
          "type": "integer"
          "format": "int64"
        "artifactCount":
          "type": "integer"
          "format": "int64"
        "externalResourcesIncluded":
          "const": true
        "warnings":
          "type": "array"
          "items":
            "type": "string"
      "required": ["formatVersion","records","revisions","attempts","assetCount","assetBytes","artifactCount","externalResourcesIncluded","warnings"]
    "StructuredToolContent":
      "type": "object"
      "additionalProperties": true
      "description": "Optional persistent render references. Known v1 types: learningRecord {id,kind,recordVersion}, artifact {id,title,revision,description}, imageGenerationJob {jobId,assetIds,status}. Preserve unknown versions and fields as raw JSON; render readable output as fallback. Provider model context does not receive this render metadata."
      "properties":
        "version":
          "type": "integer"
          "format": "int64"
        "type":
          "type": "string"
    SkillPackage:
      type: object
      additionalProperties: false
      required: [files, enabled]
      properties:
        files: { type: object, additionalProperties: { type: string } }
        binaryFiles: { type: object, additionalProperties: { type: string, contentEncoding: base64 }, default: {} }
        enabled: { type: boolean }
    SkillSummary:
      type: object
      required: [name, description, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string, minLength: 1, maxLength: 1024 }
        enabled: { type: boolean }
        compatibility: { type: string, minLength: 1, maxLength: 500 }
        license: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        allowedTools: { type: string, description: 'YAML allowed-tools, informational only; never permission.' }
    SkillDetail:
      allOf:
        - $ref: '#/components/schemas/SkillSummary'
        - type: object
          required: [files, binaryFiles]
          properties:
            files: { type: object, additionalProperties: { type: string } }
            binaryFiles: { type: object, additionalProperties: { type: string, contentEncoding: base64 } }
    Provider:
      type: object
      additionalProperties: true
      required: [id, name, base_url, api_key, api_format, created_at, updated_at]
    Model:
      type: object
      additionalProperties: true
      required: [id, provider_id, model_id, display_name, is_enabled, created_at]
      properties:
        cache_write_rate:
          type: [number, "null"]
          description: Cache-write multiplier from Messenger Extended Models Protocol. Null means unknown; zero means free.
        metadata: { $ref: "#/components/schemas/ModelMetadata" }
        metadata_overrides: { $ref: "#/components/schemas/ModelMetadata" }
    ModelMetadata:
      type: [object, "null"]
      description: Optional capability fields. Explicit false, zero, and empty lists are preserved.
      properties:
        displayName: { type: string }
        inputModalities: { type: array, items: { type: string } }
        reasoning: { type: boolean }
        reasoningEfforts: { type: array, items: { type: string } }
        defaultReasoningEffort: { type: string }
        contextWindow: { type: integer, minimum: 0 }
        maxOutputTokens: { type: integer, minimum: 1 }
        supportsTemperature: { type: boolean }
        supportsTopP: { type: boolean }
        supportsPenalties: { type: boolean }
    Agent:
      type: object
      additionalProperties: true
      required: [id, name, system_prompt, is_default, role, created_at, updated_at]
    Project:
      type: object
      additionalProperties: true
      required: [id, name, workspace, created_at, updated_at]
      properties:
        device_id:
          type: [string, "null"]
          description: |
            Device that owns `workspace`. Omitted/null on write = keep the
            recorded owner, else this device. Workspace tools of the project's
            conversations execute on this device; while it is offline the
            project is unavailable.
    ProjectView:
      description: A project as returned by the API, with its availability.
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [owner, available]
          properties:
            owner:
              oneOf:
                - type: object
                  required: [kind]
                  properties: { kind: { const: local } }
                - type: object
                  required: [kind, deviceId, online]
                  properties:
                    kind: { const: remote }
                    deviceId: { type: string }
                    online: { type: boolean }
            available:
              type: boolean
              description: False exactly while a remote owner is offline.
    Conversation:
      type: object
      additionalProperties: true
      required: [id, title, provider_id, agent_id, created_at, updated_at]
    Message:
      type: object
      additionalProperties: true
      required: [id, conversation_id, role, content, timestamp, status]
    DeviceControlSettings:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        name: { type: string }
        agents:
          type: array
          items:
            type: object
            required: [id, name, command]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string, maxLength: 4000 }
              enabled: { type: boolean, default: true }
              providerTakeover: { type: boolean, default: false, description: Opt-in provider relay for built-in ACP profiles. }
              command: { type: string }
              args: { type: array, items: { type: string } }
              env: { type: object, additionalProperties: { type: string } }
              cwd: { type: [string, "null"] }
    DeviceSessionCommand:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [catalog, create, history, setMode, prompt, store, sessionSettings, setSessionConfig, steer] }
        kind: { type: string, enum: [acp, mcp], description: Integration Store category (requires Cloud sign-in). }
        agentId: { type: string }
        projectId: { type: [string, "null"], description: Required when creating an ACP session. }
        sessionId: { type: string }
        before: { type: [string, "null"] }
        content: { type: array, items: { type: object }, description: ACP content blocks (text, image, embedded resource); prompt or steer only. }
        configId: { type: string, description: Agent-provided configuration ID for setSessionConfig. }
        value: { type: [string, boolean], description: Agent-provided selection ID or boolean value. }
        modeId: { type: string, description: Legacy Agent mode ID (mutually exclusive with configId). }
        writable: { type: boolean }
        text: { type: string }
    ChatRequest:
      type: object
      properties:
        content: { type: string }
        operation: { type: string, enum: [send, retry, regenerate, continue], default: send }
        partsJson: { type: string, description: Persisted multimodal content for a send. }
        messageGroup: { type: array, items: { type: string }, description: Validated assistant and tool rows for a native regenerate. }
        disableTools: { type: boolean, default: false }
        messageId: { type: string }
        toolSpecs:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              description: { type: string }
              parametersJson: { type: string }
    Page:
      type: object
      required: [items, offset, limit, total]
      properties:
        items: { type: array, items: {} }
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        nextOffset: { type: [integer, "null"] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        detail: { type: [string, "null"] }
  requestBodies:
    Provider:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } }
    Model:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } }
    Agent:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } }
    Project:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } }
    Conversation:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } }
    Message:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
    Credentials:
      required: true
      content:
        application/json:
          schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
    CardCode:
      required: true
      content:
        application/json:
          schema: { type: object, required: [code], properties: { code: { type: string } } }
    PasswordChange:
      required: true
      content:
        application/json:
          schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string } } }
    CurrentPassword:
      required: true
      content:
        application/json:
          schema: { type: object, required: [currentPassword], properties: { currentPassword: { type: string } } }
    Avatar:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [bytesBase64, filename, mime]
            properties:
              bytesBase64: { type: string, contentEncoding: base64 }
              filename: { type: string }
              mime: { type: string }
  responses:
    Provider:
      description: Provider
      content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } }
    Model:
      description: Model
      content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } }
    Agent:
      description: Agent
      content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } }
    Project:
      description: Project with its owner and availability
      content: { application/json: { schema: { $ref: "#/components/schemas/ProjectView" } } }
    Conversation:
      description: Conversation
      content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } }
    Message:
      description: Message
      content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
    ProviderPage:
      description: Provider page
      content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
