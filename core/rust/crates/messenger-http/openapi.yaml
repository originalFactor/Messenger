  "/learning/package/export":
    "get":
      "operationId": "exportLearningBundle"
      "description": "Complete device-local learning metadata plus owned asset bytes and artifact revisions/state. Maximum 96 MiB JSON and 64 MiB decoded asset bytes. Does not include Provider credentials, image generation profiles/jobs, bearer tokens, absolute paths, execution trust or network grants."
