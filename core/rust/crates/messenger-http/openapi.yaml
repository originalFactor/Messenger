  /skills:
    get:
      operationId: listSkills
      description: Device-local Agent Skills catalog, sorted by name; no bundled file content.
      responses:
        "200":
          description: Skill discovery metadata, including disabled packages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SkillSummary' } }
  /skills/remote/discover:
    post:
      operationId: discoverRemoteSkills
      description: |
        Discover public GitHub owner/repo, repository/tree/blob SKILL.md links,
        GitHub git@github.com SSH shorthand (normalized to HTTPS), or arbitrary
        Git smart-HTTPS repositories. No credentials, redirects, Git executable,
        checkout, hooks, submodules or scripts. GitHub branch names containing
        slashes resolve by the longest advertised ref. Optional path overrides
        the URL subtree; optional ref overrides its revision. Empty path is the
        repository root. Returns canonical source and immutable commit ref to
        pass unchanged with a candidate path to remote preview. Does not save.
        Fails visibly for no skills, unsupported schemes, private repositories,
        truncated/oversized trees, timeouts or network errors. Invalid candidate
        metadata is returned in warnings while valid siblings remain selectable.
      requestBody:
        required: true
        content:
          application/json:
            schema: &remoteSkillRequest
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: { type: string, maxLength: 2048 }
                path: { type: string, maxLength: 512 }
                ref: { type: string, maxLength: 512 }
      responses:
        "200":
          description: At most 128 skill candidates beneath the selected subtree.
          content:
            application/json:
              schema:
                type: object
                required: [source, ref, items, warnings]
                properties:
                  source: { type: string }
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [path, message]
                      properties:
                        path: { type: string }
                        message: { type: string }
                  ref: { type: string, pattern: '^[0-9a-f]{40}$' }
                  items:
                    type: array
                    items:
                      type: object
                      required: [path, name, description]
                      properties:
                        path: { type: string }
                        name: { type: string }
                        description: { type: string }
        "400": { description: Unsupported, invalid, oversized, inaccessible or timed-out remote source. }
  /skills/remote/preview:
    post:
      operationId: previewRemoteSkill
      description: |
        Fetch one discovered skill using canonical source, pinned ref and path.
        Returns the existing validated package preview without writing catalog
        state. UTF-8 and base64 binary assets are preserved; symlinks/submodules
        fail explicitly, .git data and nested skill packages are excluded.
        Limits: 128 files, 1 MiB/file, 4 MiB/package, tree depth 32, 20000 tree
        entries/pack objects, 32 MiB Git wire response, 8 MiB GitHub tree,
        90 seconds overall; GitHub resolves selected directories before fetching
        their recursive tree, then downloads only selected package blobs.
        Save requires the existing PUT /skills/{name} operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: *remoteSkillRequest
      responses:
        "200":
          description: Validated editable package; no persistence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "400": { description: Invalid selection/package, unsupported resources, network failure or limit exceeded. }
  /skills/validate:
    post:
      operationId: validateSkill
      description: |
        Validate an import without writing it. Infer name from SKILL.md when name
        is absent; a supplied name must match. enabled defaults to true here.
        This path also supports the normal GET/PUT/DELETE package operations
        for a skill whose literal name is validate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files: { type: object, additionalProperties: { type: string } }
                binaryFiles: { type: object, additionalProperties: { type: string, contentEncoding: base64 }, default: {} }
                enabled: { type: boolean, default: true }
                name: { type: string }
      responses:
        "200":
          description: Valid package preview; no persistence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "400": { description: Invalid frontmatter, package, name or paths. }
        "413": { description: JSON request exceeds 26 MiB. }
  /skills/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      operationId: getSkill
      responses:
        "200":
          description: Skill metadata and all bundled text and binary files.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "404": { description: Skill not found. }
    put:
      operationId: putSkill
      description: |
        Create or fully replace one device-local package. SKILL.md must be text
        with YAML frontmatter containing matching name and description. Names
        use lowercase ASCII letters, digits and single internal hyphens.
        Relative paths use /, cannot have empty, dot or dot-dot components,
        backslashes, colons, control characters, or file/directory collisions,
        and are at most 512 UTF-8 bytes. Text/binary path collisions are rejected.
        Packages contain at most 128 files, 1 MiB decoded bytes per file and
        4 MiB total decoded bytes. Binary files use standard padded base64.
        Scripts/assets are stored as data; allowed-tools never grants permission.
        These packages are not synced to Cloud. MCP-capable ACP sessions receive
        enabled discovery metadata per prompt and read text through a private
        per-worker MCP messenger_skills tool. Reads require an active owning turn;
        Skills never grant delegation or script execution permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillPackage' }
      responses:
        "200":
          description: Saved package detail, including validated metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "400": { description: Invalid frontmatter, package, name or paths. }
        "413": { description: JSON request exceeds 26 MiB. }
    delete:
      operationId: deleteSkill
      responses:
        "204": { description: Skill deleted. }
        "404": { description: Skill not found. }
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, api_version]
                properties:
                  status: { type: string, const: ok }
                  api_version: { type: string, const: v1 }
  /meta:
    get:
      operationId: meta
      responses:
        "200":
          description: API and core versions plus implemented capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, serverVersion, capabilities]
                properties:
                  apiVersion: { type: string, const: v1 }
                  serverVersion: { type: string }
                  capabilities:
                    type: object
                    additionalProperties: { type: boolean }
  /events:
    get:
      operationId: coreEvents
      responses:
        "200":
          description: |
            Core change feed. Events are named `change` and carry
            `{kind, ids}` JSON. `resync` means the client lagged and should
            re-query every visible collection. `remoteTool` /
            `remoteToolCancelled` are addressed to the platform client that
            executes tools: another device asked this one to run a workspace
            tool of a project it owns (see `docs/REMOTE.md`).
          content:
            text/event-stream:
              schema: { type: string }
  /remote/status:
    get:
      operationId: remoteStatus
      description: |
        This device's id and relay presence. `connected` is false while the
        device is signed out or cannot reach the cloud relay; remote-owned
        projects are then unavailable.
      responses:
        "200":
          description: Remote relay status.
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, connected, onlineDevices]
                properties:
                  deviceId: { type: string }
                  connected: { type: boolean }
                  onlineDevices: { type: array, items: { type: string } }
  /acp:
    get:
      operationId: connectAcp
      description: Authenticated loopback WebSocket carrying ACP v1 JSON-RPC bytes for the stdio adapter.
      responses:
        "101": { description: WebSocket connected. }
        "401": { description: Invalid loopback bearer. }
  /control/settings:
    get:
      operationId: getDeviceControlSettings
      responses:
        "200":
          description: Device-local settings and ACP profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceControlSettings" }
    put:
      operationId: setDeviceControlSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceControlSettings" }
      responses:
        "200": { description: Settings saved. }
        "400": { description: Invalid profile or cloud sign-in required to enable control. }
  /mcp/agent-delegation:
    get:
      operationId: getAgentDelegationSetting
      responses:
        "200":
          description: Device-local delegation setting, disabled by default.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
    put:
      operationId: setAgentDelegationSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Setting saved. }
  /control/agent-relay:
    get:
      operationId: getAgentRelayStatus
      responses:
        "200":
          description: Running state and loopback base URL; never includes the relay token.
          content:
            application/json:
              schema:
                type: object
                required: [running]
                properties:
                  running: { type: boolean }
                  baseUrl: { type: string }
    post:
      operationId: startAgentRelay
      responses:
        "200":
          description: Running loopback base URL and secret relay token. Requires the local Core bearer token.
          content:
            application/json:
              schema:
                type: object
                required: [baseUrl, token]
                properties:
                  baseUrl: { type: string }
                  token: { type: string }
    delete:
      operationId: stopAgentRelay
      responses:
        "204": { description: Relay stopped. }
  /control/platform-tools:
    put:
      operationId: publishDeviceToolCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceSupported, tools]
              properties:
                workspaceSupported: { type: boolean }
                tools: { type: array, items: { type: object } }
                toolsReady:
                  type: boolean
                  description: True after initial enabled MCP server connection attempts finish and the published tool inventory is current.
                mcpServers:
                  type: array
                  description: Enabled client MCP configurations, held in memory for ACP session setup. May contain credentials. Native ACP startup waits for the first explicit array; omitting this field leaves the prior MCP configuration unchanged.
                  items: { type: object }
      responses:
        "204": { description: Platform tool availability updated. }
  /control/commands/{requestId}:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: runDeviceSessionCommand
      description: Catalog sessions include projectId (nullable) and updatedAt (Unix milliseconds). Native ACP setup waits up to 10 seconds for the initial MCP configuration; device-owned Messenger turns with tools wait up to 75 seconds for initial tool discovery. Timeout yields a platform_catalog_unavailable stream error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSessionCommand" }
      responses:
        "200":
          description: Command result or prompt events documented in docs/SSE.md. Closing the stream cancels work.
          content:
            text/event-stream:
              schema: { type: string }
  /control/commands/{requestId}/permission:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: answerDeviceToolPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
      responses:
        "204": { description: Permission choice sent to the active request. }
        "404": { description: Request is no longer active. }
  /control/commands/{requestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: cancelDeviceSessionCommand
      responses:
        "204": { description: Request cancelled. }
        "404": { description: Request is no longer active. }
  /control/processes/{requestId}/input:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    get:
      operationId: readRuntimeAcpStdin
      description: Android only. Attaches the Runtime bridge to the process input stream once.
      responses:
        "200":
          description: Newline-delimited ACP lines as SSE JSON.
          content:
            text/event-stream:
              schema: { type: string }
  /control/processes/{requestId}/output:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: writeRuntimeAcpStdout
      description: Android only. Send an empty object at EOF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                line: { type: string }
                error: { type: string, description: Optional Runtime startup error at EOF. }
      responses:
        "204": { description: Output accepted. }
  /providers:
