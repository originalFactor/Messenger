  "/learning/package/preview":
    "post":
      "operationId": "previewLearningBundle"
      "description": "Validate hashes, MIME/dimensions, safe paths, sizes, complete references/revisions, state formats and destination ID conflicts without persisting. Existing matching hash assets merge owners; learning/artifact IDs reject collisions. Imported execution/network grants reset."
      "requestBody":
        "required": true
        "content":
