openapi: 3.1.0
info:
  title: Messenger Rust Core API
  version: 1.0.0
  description: |
    Loopback-only JSON/SSE API used by the Android and Desktop clients.
    A fresh bearer token is generated for every server start. The server never
    binds to a non-loopback address.
servers:
  - url: http://127.0.0.1:{port}/api/v1
    variables:
      port:
        default: "0"
security:
  - bearerAuth: []
paths:
  /skills:
    get:
      operationId: listSkills
      description: Device-local Agent Skills catalog, sorted by name; no bundled file content.
      responses:
        "200":
          description: Skill discovery metadata, including disabled packages.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SkillSummary' } }
  /skills/remote/discover:
    post:
      operationId: discoverRemoteSkills
      description: |
        Discover public GitHub owner/repo, repository/tree/blob SKILL.md links,
        GitHub git@github.com SSH shorthand (normalized to HTTPS), or arbitrary
        Git smart-HTTPS repositories. No credentials, redirects, Git executable,
        checkout, hooks, submodules or scripts. GitHub branch names containing
        slashes resolve by the longest advertised ref. Optional path overrides
        the URL subtree; optional ref overrides its revision. Empty path is the
        repository root. Returns canonical source and immutable commit ref to
        pass unchanged with a candidate path to remote preview. Does not save.
        Fails visibly for no skills, unsupported schemes, private repositories,
        truncated/oversized trees, timeouts or network errors. Invalid candidate
        metadata is returned in warnings while valid siblings remain selectable.
      requestBody:
        required: true
        content:
          application/json:
            schema: &remoteSkillRequest
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source: { type: string, maxLength: 2048 }
                path: { type: string, maxLength: 512 }
                ref: { type: string, maxLength: 512 }
      responses:
        "200":
          description: At most 128 skill candidates beneath the selected subtree.
          content:
            application/json:
              schema:
                type: object
                required: [source, ref, items, warnings]
                properties:
                  source: { type: string }
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [path, message]
                      properties:
                        path: { type: string }
                        message: { type: string }
                  ref: { type: string, pattern: '^[0-9a-f]{40}$' }
                  items:
                    type: array
                    items:
                      type: object
                      required: [path, name, description]
                      properties:
                        path: { type: string }
                        name: { type: string }
                        description: { type: string }
        "400": { description: Unsupported, invalid, oversized, inaccessible or timed-out remote source. }
  /skills/remote/preview:
    post:
      operationId: previewRemoteSkill
      description: |
        Fetch one discovered skill using canonical source, pinned ref and path.
        Returns the existing validated package preview without writing catalog
        state. UTF-8 and base64 binary assets are preserved; symlinks/submodules
        fail explicitly, .git data and nested skill packages are excluded.
        Limits: 128 files, 1 MiB/file, 4 MiB/package, tree depth 32, 20000 tree
        entries/pack objects, 32 MiB Git wire response, 8 MiB GitHub tree,
        90 seconds overall; GitHub resolves selected directories before fetching
        their recursive tree, then downloads only selected package blobs.
        Save requires the existing PUT /skills/{name} operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: *remoteSkillRequest
      responses:
        "200":
          description: Validated editable package; no persistence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "400": { description: Invalid selection/package, unsupported resources, network failure or limit exceeded. }
  /skills/validate:
    post:
      operationId: validateSkill
      description: |
        Validate an import without writing it. Infer name from SKILL.md when name
        is absent; a supplied name must match. enabled defaults to true here.
        This path also supports the normal GET/PUT/DELETE package operations
        for a skill whose literal name is validate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files: { type: object, additionalProperties: { type: string } }
                binaryFiles: { type: object, additionalProperties: { type: string, contentEncoding: base64 }, default: {} }
                enabled: { type: boolean, default: true }
                name: { type: string }
      responses:
        "200":
          description: Valid package preview; no persistence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "400": { description: Invalid frontmatter, package, name or paths. }
        "413": { description: JSON request exceeds 26 MiB. }
  /skills/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      operationId: getSkill
      responses:
        "200":
          description: Skill metadata and all bundled text and binary files.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "404": { description: Skill not found. }
    put:
      operationId: putSkill
      description: |
        Create or fully replace one device-local package. SKILL.md must be text
        with YAML frontmatter containing matching name and description. Names
        use lowercase ASCII letters, digits and single internal hyphens.
        Relative paths use /, cannot have empty, dot or dot-dot components,
        backslashes, colons, control characters, or file/directory collisions,
        and are at most 512 UTF-8 bytes. Text/binary path collisions are rejected.
        Packages contain at most 128 files, 1 MiB decoded bytes per file and
        4 MiB total decoded bytes. Binary files use standard padded base64.
        Scripts/assets are stored as data; allowed-tools never grants permission.
        These packages are not synced to Cloud. MCP-capable ACP sessions receive
        enabled discovery metadata per prompt and read text through a private
        per-worker MCP messenger_skills tool. Reads require an active owning turn;
        Skills never grant delegation or script execution permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkillPackage' }
      responses:
        "200":
          description: Saved package detail, including validated metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkillDetail' }
        "400": { description: Invalid frontmatter, package, name or paths. }
        "413": { description: JSON request exceeds 26 MiB. }
    delete:
      operationId: deleteSkill
      responses:
        "204": { description: Skill deleted. }
        "404": { description: Skill not found. }
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                required: [status, api_version]
                properties:
                  status: { type: string, const: ok }
                  api_version: { type: string, const: v1 }
  /meta:
    get:
      operationId: meta
      responses:
        "200":
          description: API and core versions plus implemented capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [apiVersion, serverVersion, capabilities]
                properties:
                  apiVersion: { type: string, const: v1 }
                  serverVersion: { type: string }
                  capabilities:
                    type: object
                    additionalProperties: { type: boolean }
  /events:
    get:
      operationId: coreEvents
      responses:
        "200":
          description: |
            Core change feed. Events are named `change` and carry
            `{kind, ids}` JSON. `resync` means the client lagged and should
            re-query every visible collection. `remoteTool` /
            `remoteToolCancelled` are addressed to the platform client that
            executes tools: another device asked this one to run a workspace
            tool of a project it owns (see `docs/REMOTE.md`).
          content:
            text/event-stream:
              schema: { type: string }
  /remote/status:
    get:
      operationId: remoteStatus
      description: |
        This device's id and relay presence. `connected` is false while the
        device is signed out or cannot reach the cloud relay; remote-owned
        projects are then unavailable.
      responses:
        "200":
          description: Remote relay status.
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, connected, onlineDevices]
                properties:
                  deviceId: { type: string }
                  connected: { type: boolean }
                  onlineDevices: { type: array, items: { type: string } }
  /acp:
    get:
      operationId: connectAcp
      description: Authenticated loopback WebSocket carrying ACP v1 JSON-RPC bytes for the stdio adapter.
      responses:
        "101": { description: WebSocket connected. }
        "401": { description: Invalid loopback bearer. }
  /control/settings:
    get:
      operationId: getDeviceControlSettings
      responses:
        "200":
          description: Device-local settings and ACP profiles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceControlSettings" }
    put:
      operationId: setDeviceControlSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceControlSettings" }
      responses:
        "200": { description: Settings saved. }
        "400": { description: Invalid profile or cloud sign-in required to enable control. }
  /mcp/agent-delegation:
    get:
      operationId: getAgentDelegationSetting
      responses:
        "200":
          description: Device-local delegation setting, disabled by default.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
    put:
      operationId: setAgentDelegationSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Setting saved. }
  /control/agent-relay:
    get:
      operationId: getAgentRelayStatus
      responses:
        "200":
          description: Running state and loopback base URL; never includes the relay token.
          content:
            application/json:
              schema:
                type: object
                required: [running]
                properties:
                  running: { type: boolean }
                  baseUrl: { type: string }
    post:
      operationId: startAgentRelay
      responses:
        "200":
          description: Running loopback base URL and secret relay token. Requires the local Core bearer token.
          content:
            application/json:
              schema:
                type: object
                required: [baseUrl, token]
                properties:
                  baseUrl: { type: string }
                  token: { type: string }
    delete:
      operationId: stopAgentRelay
      responses:
        "204": { description: Relay stopped. }
  /control/platform-tools:
    put:
      operationId: publishDeviceToolCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceSupported, tools]
              properties:
                workspaceSupported: { type: boolean }
                tools: { type: array, items: { type: object } }
                toolsReady:
                  type: boolean
                  description: True after initial enabled MCP server connection attempts finish and the published tool inventory is current.
                mcpServers:
                  type: array
                  description: Enabled client MCP configurations, held in memory for ACP session setup. May contain credentials. Native ACP startup waits for the first explicit array; omitting this field leaves the prior MCP configuration unchanged.
                  items: { type: object }
      responses:
        "204": { description: Platform tool availability updated. }
  /control/commands/{requestId}:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: runDeviceSessionCommand
      description: Catalog sessions include projectId (nullable) and updatedAt (Unix milliseconds). Native ACP setup waits up to 10 seconds for the initial MCP configuration; device-owned Messenger turns with tools wait up to 75 seconds for initial tool discovery. Timeout yields a platform_catalog_unavailable stream error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSessionCommand" }
      responses:
        "200":
          description: Command result or prompt events documented in docs/SSE.md. Closing the stream cancels work.
          content:
            text/event-stream:
              schema: { type: string }
  /control/commands/{requestId}/permission:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: answerDeviceToolPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
      responses:
        "204": { description: Permission choice sent to the active request. }
        "404": { description: Request is no longer active. }
  /control/commands/{requestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: cancelDeviceSessionCommand
      responses:
        "204": { description: Request cancelled. }
        "404": { description: Request is no longer active. }
  /control/processes/{requestId}/input:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    get:
      operationId: readRuntimeAcpStdin
      description: Android only. Attaches the Runtime bridge to the process input stream once.
      responses:
        "200":
          description: Newline-delimited ACP lines as SSE JSON.
          content:
            text/event-stream:
              schema: { type: string }
  /control/processes/{requestId}/output:
    parameters:
      - $ref: "#/components/parameters/ControlRequestId"
    post:
      operationId: writeRuntimeAcpStdout
      description: Android only. Send an empty object at EOF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                line: { type: string }
                error: { type: string, description: Optional Runtime startup error at EOF. }
      responses:
        "204": { description: Output accepted. }
  /providers:
    get:
      operationId: listProviders
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ProviderPage" } }
    put:
      operationId: upsertProvider
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      requestBody: { $ref: "#/components/requestBodies/Provider" }
      responses: { "200": { $ref: "#/components/responses/Provider" }, "409": { description: Built-in catalog is read-only } }
  /providers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getProvider
      responses: { "200": { $ref: "#/components/responses/Provider" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceProvider
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      requestBody: { $ref: "#/components/requestBodies/Provider" }
      responses: { "200": { $ref: "#/components/responses/Provider" }, "409": { description: Built-in catalog is read-only } }
    delete:
      operationId: deleteProvider
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      responses: { "204": { description: Deleted }, "409": { description: Built-in catalog is read-only } }
  /providers/{id}/models:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listProviderModels
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ModelPage" } }
  /models:
    get:
      operationId: listModels
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ModelPage" } }
    put:
      operationId: upsertModel
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      requestBody: { $ref: "#/components/requestBodies/Model" }
      responses: { "200": { $ref: "#/components/responses/Model" }, "409": { description: Built-in catalog is read-only } }
  /models/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getModel
      responses: { "200": { $ref: "#/components/responses/Model" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceModel
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      requestBody: { $ref: "#/components/requestBodies/Model" }
      responses: { "200": { $ref: "#/components/responses/Model" }, "409": { description: Built-in catalog is read-only } }
    delete:
      operationId: deleteModel
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      responses: { "204": { description: Deleted }, "409": { description: Built-in catalog is read-only } }
  /models/{id}/enabled:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: setModelEnabled
      description: Built-in Messenger Cloud provider and models are read-only. Mutation returns 409 with code builtin_catalog_read_only; refresh through /cloud/builtin-models/sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses: { "204": { description: Updated }, "409": { description: Built-in catalog is read-only } }
  /models/discover:
    post:
      operationId: discoverProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl, apiKey]
              properties:
                baseUrl: { type: string }
                apiKey: { type: string }
                apiFormat: { type: [string, "null"] }
                skipCatalog: { type: boolean, default: false, description: Skip models.dev enrichment and return provider-supplied metadata. }
      responses: { "200": { description: Discovered model list with optional provider capability metadata, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /models/metadata/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: modelMetadata
      responses: { "200": { description: Metadata object or null, content: { application/json: { schema: { type: [object, "null"] } } } } }
  /agents:
    get:
      operationId: listAgents
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/AgentPage" } }
    put:
      operationId: upsertAgent
      requestBody: { $ref: "#/components/requestBodies/Agent" }
      responses: { "200": { $ref: "#/components/responses/Agent" } }
  /agents/default:
    get:
      operationId: getDefaultAgent
      responses: { "200": { $ref: "#/components/responses/Agent" }, "404": { $ref: "#/components/responses/NotFound" } }
  /agents/title:
    get:
      operationId: getTitleAgent
      responses: { "200": { $ref: "#/components/responses/Agent" }, "404": { $ref: "#/components/responses/NotFound" } }
  /agents/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getAgent
      responses: { "200": { $ref: "#/components/responses/Agent" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceAgent
      requestBody: { $ref: "#/components/requestBodies/Agent" }
      responses: { "200": { $ref: "#/components/responses/Agent" } }
    delete:
      operationId: deleteAgent
      description: The row with `is_default=true` is protected by the core invariant.
      responses: { "204": { description: Deleted }, "409": { $ref: "#/components/responses/GameConflict" } }
  /agents/{id}/conversations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listAgentConversations
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ConversationPage" } }
  /projects:
    get:
      operationId: listProjects
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ProjectPage" } }
    put:
      operationId: upsertProject
      requestBody: { $ref: "#/components/requestBodies/Project" }
      responses: { "200": { $ref: "#/components/responses/Project" } }
  /projects/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getProject
      responses: { "200": { $ref: "#/components/responses/Project" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceProject
      requestBody: { $ref: "#/components/requestBodies/Project" }
      responses: { "200": { $ref: "#/components/responses/Project" } }
    delete:
      operationId: deleteProject
      responses: { "204": { description: Deleted } }
  /projects/{id}/conversations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listProjectConversations
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ConversationPage" } }
  /conversations:
    get:
      operationId: listConversations
      description: Includes device-local ACP session projections (acp-prefixed IDs) alongside Messenger conversations. ACP rows never enter Cloud sync.
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses: { "200": { $ref: "#/components/responses/ConversationPage" } }
    put:
      operationId: upsertConversation
      requestBody: { $ref: "#/components/requestBodies/Conversation" }
      responses: { "200": { $ref: "#/components/responses/Conversation" } }
  /conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getConversation
      responses: { "200": { $ref: "#/components/responses/Conversation" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceConversation
      requestBody: { $ref: "#/components/requestBodies/Conversation" }
      responses: { "200": { $ref: "#/components/responses/Conversation" } }
    delete:
      operationId: deleteConversation
      responses: { "204": { description: Deleted } }
  /conversations/{id}/last-message:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      operationId: updateConversationLastMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updatedAt]
              properties:
                lastMessage: { type: [string, "null"] }
                updatedAt: { type: integer, format: int64 }
      responses: { "204": { description: Updated } }
  /conversations/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listMessages
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: beforeId, in: query, schema: { type: string } }
        - { name: fromId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Message window in chronological order.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  total: { type: integer }
                  nextBeforeId: { type: [string, "null"] }
    post:
      operationId: chat
      description: |
        Starts a chat turn. `send` inserts a user message; `retry` and
        `regenerate` reference an existing message; `continue` starts from the
        already-persisted context. If no model is configured the request fails
        with 409 `model_required` before any row changes. A conversation of a
        project owned by another device needs that device online: otherwise
        the request fails with 409 `project_unavailable` (also before any row
        changes). While it is online the project's workspace tools execute on
        the owner and never produce `ToolCallRequested` locally.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Chat event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "409": { $ref: "#/components/responses/GameConflict" }
    delete:
      operationId: deleteConversationMessages
      responses: { "204": { description: Deleted } }
  /conversations/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: cancelTurn
      responses: { "202": { description: Cancellation requested }, "404": { $ref: "#/components/responses/NotFound" } }
  /turns/tools/{callId}/result:
    parameters: [{ name: callId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: resolveToolCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output, isError]
              properties:
                output: { type: string }
                isError: { type: boolean }
      responses: { "202": { description: Result delivered }, "404": { $ref: "#/components/responses/NotFound" } }
  /messages/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMessage
      responses: { "200": { $ref: "#/components/responses/Message" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      operationId: replaceMessage
      requestBody: { $ref: "#/components/requestBodies/Message" }
      responses: { "200": { $ref: "#/components/responses/Message" } }
    delete:
      operationId: deleteMessage
      responses: { "204": { description: Deleted } }
  /kv/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      operationId: kvGet
      responses: { "200": { description: JSON string or null } }
    put:
      operationId: kvSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], properties: { value: { type: string } } }
      responses: { "204": { description: Updated } }
    delete:
      operationId: kvDelete
      responses: { "204": { description: Deleted } }
  /changes:
    post:
      operationId: markCloudChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id, deleted]
              properties:
                kind: { type: string }
                id: { type: string }
                deleted: { type: boolean }
      responses: { "204": { description: Queued } }
  /migration/import:
    post:
      operationId: importLegacyRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legacyDbDir]
              properties:
                legacyDbDir: { type: string }
                nowMs: { type: integer, format: int64 }
      responses: { "200": { description: "Import summary or `{imported:false}`" } }
  /cloud/login:
    post:
      operationId: cloudLogin
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses: { "200": { description: Cloud user }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/register:
    post:
      operationId: cloudRegister
      requestBody: { $ref: "#/components/requestBodies/Credentials" }
      responses: { "200": { description: Cloud user }, "4XX": { $ref: "#/components/responses/CloudError" } }
  /cloud/logout:
    post:
      operationId: cloudLogout
      responses: { "204": { description: Signed out } }
  /cloud/refresh:
    post:
      operationId: cloudRefresh
      responses: { "200": { description: Refreshed user }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/me:
    get:
      operationId: cloudCurrentUser
      responses: { "200": { description: Cloud user or null } }
  /cloud/server-url:
    get:
      operationId: cloudGetServerUrl
      responses: { "200": { description: JSON string } }
    put:
      operationId: cloudSetServerUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string } } }
      responses: { "204": { description: Updated } }
  /cloud/has-local-data:
    get:
      operationId: cloudHasLocalData
      responses: { "200": { description: Boolean } }
  /cloud/sync:
    post:
      operationId: cloudSync
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { replaceLocal: { type: boolean, default: false } } }
      responses: { "200": { description: Sync result }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/sync-with:
    post:
      operationId: cloudSyncWith
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                since: { type: [integer, "null"], format: int64 }
                replaceLocal: { type: boolean }
                expectedServerVersion: { type: [integer, "null"], format: int64 }
      responses: { "200": { description: Sync result }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/push-pending:
    post:
      operationId: cloudPushPending
      responses: { "200": { description: Sync result } }
  /cloud/conversations/push:
    post:
      operationId: cloudUploadConversations
      description: Upload finalized standalone TUI conversations. Supply a conversation ID after a turn. Omit the ID to explicitly upload eligible history. Bound conversations stay with their original server and account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId: { type: [string, "null"] }
                claimNew: { type: boolean, default: false, description: Bind a newly created conversation to the current signed-in account. }
      responses:
        "200":
          description: Counts of uploaded, skipped, and conflicting conversations.
          content:
            application/json:
              schema:
                type: object
                required: [uploaded, skipped, conflicts]
                properties:
                  uploaded: { type: integer }
                  skipped: { type: integer }
                  conflicts: { type: integer }
        "401": { $ref: "#/components/responses/CloudError" }
  /cloud/push-snapshot:
    post:
      operationId: cloudPushSnapshot
      responses: { "200": { description: Server version number } }
  /cloud/replace-cloud-with-local:
    post:
      operationId: cloudReplaceCloudWithLocal
      responses: { "200": { description: Sync result } }
  /cloud/cards/preview:
    post:
      operationId: previewCard
      requestBody: { $ref: "#/components/requestBodies/CardCode" }
      responses: { "200": { description: Card preview } }
  /cloud/cards/redeem:
    post:
      operationId: redeemCard
      requestBody: { $ref: "#/components/requestBodies/CardCode" }
      responses: { "200": { description: Redemption result } }
  /cloud/builtin-models/sync:
    post:
      operationId: syncBuiltinModels
      description: Provision Messenger Cloud AI from the saved account and synchronize its authoritative catalog and Messenger Extended Models Protocol metadata from /v1/models, without models.dev enrichment or local overrides. Returns zero when the account has no AI key.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { force: { type: boolean } } }
      responses: { "200": { description: Number of synchronized models } }
  /cloud/ensure-title-agent:
    post:
      operationId: ensureTitleAgent
      responses: { "204": { description: Seeded } }
  /cloud/change-password:
    post:
      operationId: changePassword
      requestBody: { $ref: "#/components/requestBodies/PasswordChange" }
      responses: { "204": { description: Updated }, "401": { $ref: "#/components/responses/CloudError" } }
  /cloud/account:
    delete:
      operationId: deleteCloudAccount
      requestBody: { $ref: "#/components/requestBodies/CurrentPassword" }
      responses: { "204": { description: Deleted } }
  /cloud/cache-avatar:
    post:
      operationId: cacheAvatar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [scope, accountId, id, url, destDir]
              properties:
                scope: { type: string }
                accountId: { type: string }
                id: { type: string }
                url: { type: string }
                version: { type: [string, "null"] }
                destDir: { type: string }
      responses: { "200": { description: Cached file path as JSON string } }
  /cloud/avatars/user:
    post:
      operationId: uploadUserAvatar
      requestBody: { $ref: "#/components/requestBodies/Avatar" }
      responses: { "200": { description: Avatar URL as JSON string } }
    delete:
      operationId: deleteUserAvatar
      responses: { "200": { description: Avatar URL as JSON string } }
  /cloud/avatars/agents/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: uploadAgentAvatar
      requestBody: { $ref: "#/components/requestBodies/Avatar" }
      responses: { "200": { description: Avatar URL as JSON string } }
    delete:
      operationId: deleteAgentAvatar
      responses: { "200": { description: Avatar URL as JSON string } }
  /cloud/market:
    get:
      operationId: listMarketAgents
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: Market page } }
  /cloud/market/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getMarketAgent
      responses: { "200": { description: Market agent } }
    delete:
      operationId: removeMarketAgent
      responses: { "204": { description: Removed } }
  /cloud/market/publish/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: publishMarketAgent
      responses: { "200": { description: Published market agent } }
  /cloud/market/import/{marketId}:
    parameters: [{ name: marketId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: importMarketAgent
      responses: { "200": { description: Imported agent } }
  /cloud/market/import-avatar/{marketId}:
    parameters: [{ name: marketId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: importMarketAgentWithAvatar
      responses: { "200": { description: Imported agent } }
  /cloud/market/update/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: pushMarketAgentUpdate
      responses: { "200": { description: Updated market agent } }
  /cloud/market/check/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: checkMarketAgentUpdate
      responses: { "200": { description: Update availability } }
  /cloud/market/apply/{agentId}:
    parameters: [{ name: agentId, in: path, required: true, schema: { type: string } }]
    post:
      operationId: applyMarketAgentUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [market], properties: { market: { type: object } } }
      responses: { "200": { description: Updated local agent } }
  /cloud/market-links:
    delete:
      operationId: clearMarketLinks
      responses: { "204": { description: Cleared } }
  /local-data:
    delete:
      operationId: clearLocalData
      description: Explicit reset path; re-seed the default Agent afterwards.
      responses: { "204": { description: Cleared } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-start token returned to the app shell by the native lifecycle bridge.
  parameters:
    ControlRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  schemas:
    SkillPackage:
      type: object
      additionalProperties: false
      required: [files, enabled]
      properties:
        files: { type: object, additionalProperties: { type: string } }
        binaryFiles: { type: object, additionalProperties: { type: string, contentEncoding: base64 }, default: {} }
        enabled: { type: boolean }
    SkillSummary:
      type: object
      required: [name, description, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string, minLength: 1, maxLength: 1024 }
        enabled: { type: boolean }
        compatibility: { type: string, minLength: 1, maxLength: 500 }
        license: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        allowedTools: { type: string, description: 'YAML allowed-tools, informational only; never permission.' }
    SkillDetail:
      allOf:
        - $ref: '#/components/schemas/SkillSummary'
        - type: object
          required: [files, binaryFiles]
          properties:
            files: { type: object, additionalProperties: { type: string } }
            binaryFiles: { type: object, additionalProperties: { type: string, contentEncoding: base64 } }
    Provider:
      type: object
      additionalProperties: true
      required: [id, name, base_url, api_key, api_format, created_at, updated_at]
    Model:
      type: object
      additionalProperties: true
      required: [id, provider_id, model_id, display_name, is_enabled, created_at]
      properties:
        cache_write_rate:
          type: [number, "null"]
          description: Cache-write multiplier from Messenger Extended Models Protocol. Null means unknown; zero means free.
        metadata: { $ref: "#/components/schemas/ModelMetadata" }
        metadata_overrides: { $ref: "#/components/schemas/ModelMetadata" }
    ModelMetadata:
      type: [object, "null"]
      description: Optional capability fields. Explicit false, zero, and empty lists are preserved.
      properties:
        displayName: { type: string }
        inputModalities: { type: array, items: { type: string } }
        reasoning: { type: boolean }
        reasoningEfforts: { type: array, items: { type: string } }
        defaultReasoningEffort: { type: string }
        contextWindow: { type: integer, minimum: 0 }
        maxOutputTokens: { type: integer, minimum: 1 }
        supportsTemperature: { type: boolean }
        supportsTopP: { type: boolean }
        supportsPenalties: { type: boolean }
    Agent:
      type: object
      additionalProperties: true
      required: [id, name, system_prompt, is_default, role, created_at, updated_at]
    Project:
      type: object
      additionalProperties: true
      required: [id, name, workspace, created_at, updated_at]
      properties:
        device_id:
          type: [string, "null"]
          description: |
            Device that owns `workspace`. Omitted/null on write = keep the
            recorded owner, else this device. Workspace tools of the project's
            conversations execute on this device; while it is offline the
            project is unavailable.
    ProjectView:
      description: A project as returned by the API, with its availability.
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [owner, available]
          properties:
            owner:
              oneOf:
                - type: object
                  required: [kind]
                  properties: { kind: { const: local } }
                - type: object
                  required: [kind, deviceId, online]
                  properties:
                    kind: { const: remote }
                    deviceId: { type: string }
                    online: { type: boolean }
            available:
              type: boolean
              description: False exactly while a remote owner is offline.
    Conversation:
      type: object
      additionalProperties: true
      required: [id, title, provider_id, agent_id, created_at, updated_at]
    Message:
      type: object
      additionalProperties: true
      required: [id, conversation_id, role, content, timestamp, status]
    DeviceControlSettings:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        name: { type: string }
        agents:
          type: array
          items:
            type: object
            required: [id, name, command]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string, maxLength: 4000 }
              enabled: { type: boolean, default: true }
              providerTakeover: { type: boolean, default: false, description: Opt-in provider relay for built-in ACP profiles. }
              command: { type: string }
              args: { type: array, items: { type: string } }
              env: { type: object, additionalProperties: { type: string } }
              cwd: { type: [string, "null"] }
    DeviceSessionCommand:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [catalog, create, history, setMode, prompt, store, sessionSettings, setSessionConfig, steer] }
        kind: { type: string, enum: [acp, mcp], description: Integration Store category (requires Cloud sign-in). }
        agentId: { type: string }
        projectId: { type: [string, "null"], description: Required when creating an ACP session. }
        sessionId: { type: string }
        before: { type: [string, "null"] }
        content: { type: array, items: { type: object }, description: ACP content blocks (text, image, embedded resource); prompt or steer only. }
        configId: { type: string, description: Agent-provided configuration ID for setSessionConfig. }
        value: { type: [string, boolean], description: Agent-provided selection ID or boolean value. }
        modeId: { type: string, description: Legacy Agent mode ID (mutually exclusive with configId). }
        writable: { type: boolean }
        text: { type: string }
    ChatRequest:
      type: object
      properties:
        content: { type: string }
        operation: { type: string, enum: [send, retry, regenerate, continue], default: send }
        partsJson: { type: string, description: Persisted multimodal content for a send. }
        messageGroup: { type: array, items: { type: string }, description: Validated assistant and tool rows for a native regenerate. }
        disableTools: { type: boolean, default: false }
        messageId: { type: string }
        toolSpecs:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              description: { type: string }
              parametersJson: { type: string }
    Page:
      type: object
      required: [items, offset, limit, total]
      properties:
        items: { type: array, items: {} }
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        nextOffset: { type: [integer, "null"] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        detail: { type: [string, "null"] }
  requestBodies:
    Provider:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } }
    Model:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } }
    Agent:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } }
    Project:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } }
    Conversation:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } }
    Message:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
    Credentials:
      required: true
      content:
        application/json:
          schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
    CardCode:
      required: true
      content:
        application/json:
          schema: { type: object, required: [code], properties: { code: { type: string } } }
    PasswordChange:
      required: true
      content:
        application/json:
          schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string } } }
    CurrentPassword:
      required: true
      content:
        application/json:
          schema: { type: object, required: [currentPassword], properties: { currentPassword: { type: string } } }
    Avatar:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [bytesBase64, filename, mime]
            properties:
              bytesBase64: { type: string, contentEncoding: base64 }
              filename: { type: string }
              mime: { type: string }
  responses:
    Provider:
      description: Provider
      content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } }
    Model:
      description: Model
      content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } }
    Agent:
      description: Agent
      content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } }
    Project:
      description: Project with its owner and availability
      content: { application/json: { schema: { $ref: "#/components/schemas/ProjectView" } } }
    Conversation:
      description: Conversation
      content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } }
    Message:
      description: Message
      content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
    ProviderPage:
      description: Provider page
      content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
    ModelPage:
      description: Model page
      content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
    AgentPage:
      description: Agent page
      content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
    ProjectPage:
      description: Project page
      content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
    ConversationPage:
      description: Conversation page
      content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    GameConflict:
      description: Core rule rejected the operation with a stable code
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CloudError:
      description: Cloud failure; `session_expired` is terminal and the local session is cleared
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
