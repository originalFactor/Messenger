[package]
name = "messenger-store"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

