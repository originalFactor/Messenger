[package]
name = "messenger-artifact-webview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
tao = "=0.37.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
wry = { version = "=0.57.2", features = ["mac-proxy"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk = "0.18"
soup3 = "0.5"
