# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# AAPT2 daemon startup can fail in Android Studio on Windows when memory is
# tight or the daemon is slow to spawn. Give it more headroom.
android.aapt2DaemonTimeouts=60s,60s,30s
# Some Android dependencies publish native libraries only for ARM ABIs. The
# app still intentionally builds separate x86_64 variants for emulator use, so
# suppress AGP's selected-target warning for those dependency artifacts.
# :runtime intentionally pairs minSdk 30 (matches the main app; the companion
# is useless standalone) with targetSdk 28 (legacy untrusted_app_27 SELinux
# domain retains exec-on-app-data, which the main app's targetSdk-36 domain
# lost to Android 10+ W^X) — verified on-device.
android.sync.suppressAgpWarnings=CANNOT_BUILD_SELECTED_TARGET_ABI,UNSUPPORTED_PROJECT_OPTION_USE,MIN_SDK_VERSION_GREATER_THAN_TARGET_SDK
# Kotlin/JS/Wasm toolchain: the Node.js distribution repository it would add
# is rejected by settings.gradle.kts's FAIL_ON_PROJECT_REPOS, and the build
# host already has Node.js (needed for the webpack dev server / distribution).
# Pinning both to the installed one keeps the resolved version unambiguous.
kotlin.js.nodejs.download=false
kotlin.js.yarn=false
kotlin.js.nodejs.version=24.19.0

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
