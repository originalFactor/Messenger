# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# The Kotlin compile daemon defaults to the Gradle JVM's -Xmx, which is sized
# for the build JVM; give it its own budget so a large incremental round does
# not push the Gradle daemon into GC.
kotlin.daemon.jvmargs=-Xmx4g
# AAPT2 daemon startup can fail in Android Studio on Windows when memory is
# tight or the daemon is slow to spawn. Give it more headroom.
android.aapt2DaemonTimeouts=60s,60s,30s
# Never download SDK packages during a build. The project pins the exact
# compileSdk / build-tools / NDK / CMake versions installed locally (see the
# ext block in the root build script); AGP's own defaults are older, so an
# implicit dependency would otherwise fetch an unused package on every new
# machine. Missing packages now fail loudly with the component name.
android.builder.sdkDownload=false
# Some Android dependencies publish native libraries only for ARM ABIs. The
# shipped matrix is arm64-v8a (ext["releaseAbis"]) plus armeabi-v7a for :wear
# (ext["wearReleaseAbis"]); debug is x86_64 only (ext["debugAbis"] /
# ext["wearDebugAbis"]) so Android Studio Run works on an AVD, so suppress AGP's
# selected-target warning for those dependency artifacts.
# :runtime intentionally pairs minSdk 30 (matches the main app; the companion
# is useless standalone) with targetSdk 28 (legacy untrusted_app_27 SELinux
# domain retains exec-on-app-data, which the main app's targetSdk-36 domain
# lost to Android 10+ W^X) — verified on-device.
android.sync.suppressAgpWarnings=CANNOT_BUILD_SELECTED_TARGET_ABI,UNSUPPORTED_PROJECT_OPTION_USE,MIN_SDK_VERSION_GREATER_THAN_TARGET_SDK

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# :shared uses intentional manual source-set hierarchy (jvmSharedMain /
# jvmSharedTest shared by Android + Desktop), which cannot be expressed by the
# default hierarchy template. The explicit dependsOn() edges would otherwise
# disable the template with a warning; disabling it up front keeps the hierarchy
# explicit and the build warning-free.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# KGP 2.4 owns the supported multiplatform incremental compiler defaults; do not use internal flags.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# Compose Hot Reload creates deprecated Gradle configurations on Gradle 9.8; desktop runs do not require it.
org.jetbrains.compose.hot.reload.disable=true
